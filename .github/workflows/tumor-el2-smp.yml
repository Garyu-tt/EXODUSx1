name: Tumor EL2 four-core SMP reference
on:
  pull_request:
    paths:
      - 'exodus/frankenstein/el2_smp_reference.S'
      - 'exodus/frankenstein/EL2_SMP.md'
      - '.github/workflows/tumor-el2-smp.yml'
permissions:
  contents: read
jobs:
  smp-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu qemu-system-arm
      - run: |
          set -eu
          src=exodus/frankenstein
          aarch64-linux-gnu-as -march=armv8-a "$src/el2_smp_reference.S" -o "$RUNNER_TEMP/smp.o"
          aarch64-linux-gnu-ld -T "$src/el2_stage2_reference.ld" "$RUNNER_TEMP/smp.o" -o "$RUNNER_TEMP/smp.elf"
          for mode in on off; do
            rc=0
            timeout 12s qemu-system-aarch64 -machine virt,virtualization=$mode -cpu cortex-a57 -smp 4 -m 128M -nographic -monitor none -serial stdio -net none -d int,guest_errors -D "$RUNNER_TEMP/$mode.trace" -kernel "$RUNNER_TEMP/smp.elf" > "$RUNNER_TEMP/$mode.log" 2>&1 || rc=$?
            cat "$RUNNER_TEMP/$mode.log"
            tail -c 8192 "$RUNNER_TEMP/$mode.trace"
            test "$rc" = 124
            if [ "$mode" = on ]; then
              expected=EXODUS_SMP_REF_PASS
              for core in 0 1 2 3; do
                test "$(grep -c "Taking exception 11 \\[Hypervisor Call\\] on CPU $core$" "$RUNNER_TEMP/$mode.trace")" = 64
              done
            else expected=EXODUS_SMP_REF_EL1_BLOCKED; fi
            test "$(grep -c '^EXODUS_SMP_REF_' "$RUNNER_TEMP/$mode.log")" = 1
            tr -d '\r' < "$RUNNER_TEMP/$mode.log" | grep -Fx "$expected"
          done
