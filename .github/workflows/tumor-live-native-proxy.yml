name: Tumor live AMP2 native process proxy
on:
  pull_request:
    paths:
      - 'exodus/frankenstein/armv7_authority/amp2_*'
      - 'exodus/frankenstein/armv7_authority/exodus_amp2_proxy.c'
      - 'exodus/frankenstein/armv7_authority/Makefile.amp2proxy'
      - 'exodus/frankenstein/amp2_*'
      - 'exodus/frankenstein/el2_freebsd_abi*'
      - 'exodus/frankenstein/amp2_pid_fixture.S'
      - 'exodus/frankenstein/elf64_loader*'
      - 'exodus/frankenstein/elf_exec_*'
      - 'exodus/frankenstein/amp_execution_contract.c'
      - '.github/workflows/tumor-live-native-proxy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-native-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 exodus/frankenstein/armv7_authority/test_serial_patterns.py
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-utils u-boot-qemu dosfstools mtools xz-utils python3-pexpect curl gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - run: |
          set -eu
          src="$GITHUB_WORKSPACE/exodus/frankenstein"
          mkdir -p "$RUNNER_TEMP/armv7-gate"
          cd "$RUNNER_TEMP/armv7-gate"
          image=FreeBSD-15.1-RELEASE-arm-armv7-GENERICSD.img.xz
          curl -fL --retry 3 "https://download.freebsd.org/releases/ISO-IMAGES/15.1/$image" -o "$image"
          printf '%s  %s\n' d568d7324825af9072405b11b7d0f4ba892d10ca05687fe4fd65e328e72cf7b8 "$image" | sha256sum -c -
          xz -dc "$image" > disk.raw
          qemu-img resize -f raw disk.raw 12G
          curl -fL --retry 3 https://download.freebsd.org/releases/arm64/aarch64/15.1-RELEASE/src.txz -o src.txz
          printf '%s  src.txz\n' cf5762da53fd52e1eaf0f9ceee9bf58cbe314c821031d0d9ffa76823185a89e1 | sha256sum -c -
          truncate -s 512M seed.img
          mkfs.vfat -n EXODUSSEED seed.img
          mcopy -i seed.img src.txz "$src/amp_execution_contract.c" "$src/armv7_authority/"{exodus_amp1.c,Makefile,test_kernel_amp.c,guest.sh,amp2_proxy_relay.c,amp2_proxy_guest.sh,exodus_amp2_proxy.c,Makefile.amp2proxy} "$src/amp2_pid_contract.c" ::
          bios=/usr/lib/u-boot/qemu_arm/u-boot.bin
          test -s "$bios"
          aarch64-linux-gnu-as -march=armv8-a "$src/amp2_pid_fixture.S" -o fixture.o
          aarch64-linux-gnu-ld -z max-page-size=4096 --build-id=none -T "$src/elf_exec_fixture.ld" fixture.o -o elf_input.elf
          aarch64-linux-gnu-objcopy -I binary -O elf64-littleaarch64 -B aarch64 --rename-section .data=.rodata.elf,alloc,load,readonly,data,contents elf_input.elf elf_input.o
          aarch64-linux-gnu-gcc -march=armv8-a -mgeneral-regs-only -mstrict-align -ffreestanding -fno-builtin -fno-stack-protector -fno-pie -no-pie -static -nostdlib -O2 -Wl,--build-id=none,--fatal-warnings -T "$src/el2_freebsd_abi_reference.ld" "$src/el2_freebsd_abi_reference.S" "$src/amp2_pid_bridge.c" "$src/elf64_loader.c" "$src/elf_exec_boot.c" elf_input.o -o amp.elf
          /usr/bin/python3 "$src/armv7_authority/amp2_proxy_run.py" disk.raw seed.img "$bios" serial.log amp.elf a57-trace.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-native-proxy-evidence
          path: |
            ${{ runner.temp }}/armv7-gate/serial.log
            ${{ runner.temp }}/armv7-gate/a57-trace.log
          if-no-files-found: warn
