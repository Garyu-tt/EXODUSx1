          s=Path("sysroot/usr/include/sys/sysctl.h").read_text()
          names=["CTL_HW","HW_NCPU","HW_PAGESIZE","CTL_KERN","KERN_OSRELDATE","KERN_ARND"]
          out=[]
          for name in names:
              m=re.search(r"(?m)^\s*#\s*define\s+"+name+r"\s+([0-9]+)\b",s)
              assert m,name
              out.append("#define EX_"+name+" "+m[1])
          Path("evidence/runtime-sysctl/sysctl_ids.h").write_text("\n".join(out)+"\n")
          PY
          # Confirm actual MIB at the first previously observed read-only address.
          python3 - <<'PY'
          import struct
          from pathlib import Path
          image=Path("evidence/hello-page.elf").read_bytes()
          off=struct.unpack_from("<Q",image,32)[0]
          size,num=struct.unpack_from("<HH",image,54)
          addr=0x2065e8
          matches=[]
          for i in range(num):
              typ,flags,fo,va,pa,fs,ms,align=struct.unpack_from("<IIQQQQQQ",image,off+i*size)
              if typ==1 and va<=addr and addr-va+8<=fs:
                  matches.append(struct.unpack_from("<II",image,fo+addr-va))
          assert len(matches)==1,matches
          print("First observed MIB:",matches[0])
          Path("evidence/first-mib.txt").write_text(str(matches[0])+"\n")
          PY
          cd evidence/runtime-sysctl
          # CI-only entropy fixture, generated once per run from host OS.
          # Never use this image for production: embedded bytes are not secret.
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path("build/test-entropy.bin").write_bytes(os.urandom(16384))
          PY
          printf '\n.section .rodata.testentropy,"a"\n.global entropy_start,entropy_end\nentropy_start: .incbin "build/test-entropy.bin"\nentropy_end:\n' >> build/image.S
          python3 - <<'PY'
          from pathlib import Path
          p=Path("bare/monitor.c")
          s=p.read_text()
          anchor="void trap(uint64_t *regs){"
          assert s.count(anchor)==1
          s=s.replace(anchor,r'''#include "sysctl_ids.h"
          static void sysret(uint64_t *regs,uint64_t value,int error){
              regs[0]=value;
              uint64_t ps=READ(spsr_el1);
              WRITE(spsr_el1,error?ps|(UINT64_C(1)<<29):ps&~(UINT64_C(1)<<29));ISB();
          }
          extern const uint8_t entropy_start[],entropy_end[];
          static size_t entropy_used;
          /* CI-only finite entropy input. No fallback to clocks or fixed seed. */
          static void sysctl_entropy(uint64_t *r){
              if(!r[3]||!user_range(r[3],8,6)){sysret(r,14,1);return;}
              uint64_t cap=rd(mem+r[3]-VA,8),actual=cap<256?cap:256;
              if(!r[2]){actual=256;memcpy(mem+r[3]-VA,&actual,8);sysret(r,0,0);return;}
              if(!user_range(r[2],actual,6)){sysret(r,14,1);return;}
              size_t available=(uintptr_t)entropy_end-(uintptr_t)entropy_start;
              if(entropy_used>available||actual>available-entropy_used){sysret(r,5,1);return;}
              memcpy(mem+r[2]-VA,entropy_start+entropy_used,(size_t)actual);
              entropy_used+=(size_t)actual;
              memcpy(mem+r[3]-VA,&actual,8);
              sysret(r,0,0);
              msg("PASS: sysctl read-only kern.arandom CI entropy bytes=");hex(actual);msg("\n");
          }
          /* Only read-only properties of this one-vCPU reference. */
          static int sysctl_read(uint64_t *r){
              if(r[1]!=2||!user_range(r[0],8,4)){sysret(r,22,1);return 1;}
              uint32_t mib[2];memcpy(mib,mem+r[0]-VA,sizeof mib);
              msg("SYSCTL_MIB ");hex(mib[0]);msg(" ");hex(mib[1]);msg("\n");
              if(r[4]||r[5]){sysret(r,1,1);return 1;}
              if(mib[0]==EX_CTL_KERN&&mib[1]==EX_KERN_ARND){sysctl_entropy(r);return 1;}
              uint32_t value;
              const char *label;
              if(mib[0]==EX_CTL_HW&&mib[1]==EX_HW_NCPU){value=1;label="hw.ncpu";}
              else if(mib[0]==EX_CTL_HW&&mib[1]==EX_HW_PAGESIZE){value=P;label="hw.pagesize";}
              else return 0;
              if(!r[3]||!user_range(r[3],8,6)){sysret(r,14,1);return 1;}
              uint64_t cap=rd(mem+r[3]-VA,8),actual=sizeof value;
              if(r[2]&&cap<actual){
                  memcpy(mem+r[3]-VA,&actual,8);sysret(r,12,1);return 1;
              }
              if(r[2]&&!user_range(r[2],actual,6)){sysret(r,14,1);return 1;}
              if(r[2])memcpy(mem+r[2]-VA,&value,sizeof value);
              memcpy(mem+r[3]-VA,&actual,8);
              sysret(r,0,0);msg("PASS: sysctl read-only ");msg(label);msg("\n");return 1;
          }
          '''+anchor)
          old='    msg("UNHANDLED_SVC number=");'
          assert s.count(old)==1
          s=s.replace(old,'    if(regs[8]==202&&sysctl_read(regs))return;\n'+old)
          s=s.replace("R130_DISPATCH_BOUNDARY_PASS","R131_SYSCTL_BOUNDARY_PASS")
          p.write_text(s)
          PY
          FLAGS=(--target=aarch64-none-elf -mcpu=cortex-a57 -mgeneral-regs-only -mstrict-align -ffreestanding -fno-builtin -fno-stack-protector -Wall -Wextra -Werror -O2 -I. -Ibare)
          for src in a57_s1 a57_s2 elf64_loader elf64_page_plan arena bare/monitor; do
           clang "${FLAGS[@]}" -c "$src.c" -o "build/$(basename "$src").o"
          done
          clang --target=aarch64-none-elf -mcpu=cortex-a57 -c bare/boot.S -o build/boot.o
          clang --target=aarch64-none-elf -c build/image.S -o build/image.o
          ld.lld -T bare/link.ld --fatal-warnings -o build/stock.elf build/{boot,monitor,a57_s1,a57_s2,elf64_loader,elf64_page_plan,arena,image}.o
          python3 ../run-qemu.py R131_SYSCTL_BOUNDARY_PASS
          ! grep -q 'FAIL:' serial.txt
          test "$(grep -c '^STOCK_SVC ' serial.txt)" -ge 9
          test "$(grep -c '^PASS: sysctl read-only ' serial.txt)" -ge 1
          test "$(grep -Fxc 'PASS: clock_gettime monotonic fast returned counter-derived timespec' serial.txt)" -ge 2
          test "$(grep -Fxc 'PASS: aligned anonymous mmap installed in Stage 1 and Stage 2' serial.txt)" -ge 1
          test "$(grep -c '^UNHANDLED_SVC ' serial.txt)" = 1
          test "$(grep -Fxc R131_SYSCTL_BOUNDARY_PASS serial.txt)" = 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exodus-stock-freebsd-libc-baseline
          path: evidence/
          if-no-files-found: warn
