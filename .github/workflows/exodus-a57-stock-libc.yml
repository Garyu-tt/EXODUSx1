name: EXODUS R117 stock FreeBSD arm64 libc and CRT baseline
on:
  push:
    branches: [integration/exodus-a57-mmu-gate]
    paths: ['.github/workflows/exodus-a57-stock-libc.yml']
  pull_request:
    paths: ['.github/workflows/exodus-a57-stock-libc.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stock-libc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install cross tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld llvm binutils xz-utils
      - name: Acquire original FreeBSD 15.1 ARM64 sysroot
        run: |
          set -euo pipefail
          mkdir -p evidence sysroot
          url=https://download.freebsd.org/releases/arm64/aarch64/15.1-RELEASE
          curl -fL --retry 3 "$url/MANIFEST" -o evidence/MANIFEST
          curl -fL --retry 3 "$url/base.txz" -o base.txz
          awk '$1=="base.txz" && length($2)==64 {print $2 "  base.txz"; n++} END {if(n!=1)exit 1}' evidence/MANIFEST > evidence/base.sha256
          sha256sum -c evidence/base.sha256
          tar -xJf base.txz -C sysroot --no-same-owner ./usr/include ./usr/lib ./lib
          test -f sysroot/usr/lib/libc.a
          test -f sysroot/usr/lib/crt1.o
          readelf -h sysroot/usr/lib/crt1.o | tee evidence/crt-header.txt
          sha256sum sysroot/usr/lib/libc.a sysroot/usr/lib/crt1.o > evidence/library.sha256
      - name: Compile normal program using original CRT and static libc
        run: |
          set -euo pipefail
          cat > evidence/hello.c <<'EOF'
          #include <stdio.h>
          #include <string.h>
          #include <unistd.h>
          static _Thread_local volatile unsigned counter=23;
          int main(int argc,char **argv){
              if(argc!=2||strcmp(argv[1],"exodus")||counter!=23)return 2;
              counter++;
              printf("EXODUS libc: %s pid=%ld TLS=%u\n",argv[1],(long)getpid(),counter);
              return 23;
          }
          EOF
          clang --target=aarch64-unknown-freebsd15.1 --sysroot="$PWD/sysroot" -mcpu=cortex-a57 -fno-pie -O2 -Wall -Wextra -Werror -c evidence/hello.c -o evidence/hello.o
          clang --target=aarch64-unknown-freebsd15.1 --sysroot="$PWD/sysroot" -fuse-ld=lld -static -Wl,-no-pie -Wl,-Map,evidence/hello.map -Wl,--build-id=none evidence/hello.o -o evidence/hello.elf
          readelf -h evidence/hello.elf | grep -Eq 'Type:[[:space:]]+EXEC'
          readelf -h -lW -d evidence/hello.elf | tee evidence/elf-layout.txt
          readelf -sW evidence/hello.elf > evidence/symbols.txt
          llvm-nm --undefined-only evidence/hello.elf > evidence/undefined.txt
          cat evidence/undefined.txt
          # Undefined weak references are valid in a static ELF; reject all
          # unresolved non-weak symbols.
          awk '$7=="UND" && NF>=8 && $5!="WEAK" {print; bad=1} END {exit bad}' evidence/symbols.txt
          echo 'PASS: no unresolved strong symbols'
          grep -q 'AArch64' evidence/elf-layout.txt
          grep -q ' TLS ' evidence/elf-layout.txt
          ! grep -q ' INTERP ' evidence/elf-layout.txt
          for sym in _start main printf getpid; do
            grep -Eq "[[:space:]]$sym$" evidence/symbols.txt
          done
          grep -Fq 'libc.a' evidence/hello.map
          echo 'PASS: original libc map provenance'
          grep -Fq 'crt1.o' evidence/hello.map
          echo 'PASS: original CRT map provenance'
          # Produce a second stock-libc ELF using standard LLD layout policy,
          # without a bespoke linker script or replacing CRT/libc.
          clang --target=aarch64-unknown-freebsd15.1 --sysroot="$PWD/sysroot" -fuse-ld=lld -static -Wl,-no-pie,-z,separate-loadable-segments -Wl,-Map,evidence/hello-page.map -Wl,--build-id=none evidence/hello.o -o evidence/hello-page.elf
          readelf -h -lW -rW evidence/hello-page.elf > evidence/page-layout.txt
          cat evidence/page-layout.txt
          python3 - <<'PY'
          import struct
          from pathlib import Path
          s=Path("evidence/hello-page.elf").read_bytes()
          assert s[:7]==b"\x7fELF\x02\x01\x01"
          _,machine,_,entry,off=struct.unpack_from("<HHIQQ",s,16)
          entsize,num=struct.unpack_from("<HH",s,54)
          assert machine==183 and entsize==56 and 0<num<=64
          pages=set()
          ranges=[]
          for i in range(num):
              typ,flags,fo,va,pa,fs,ms,align=struct.unpack_from("<IIQQQQQQ",s,off+i*entsize)
              if typ!=1: continue
              assert flags in (4,5,6) and 0<ms and fs<=ms and fo+fs<=len(s)
              assert (va-fo)%4096==0
              r=set(range(va//4096,(va+ms+4095)//4096))
              assert not pages.intersection(r), "shared PT_LOAD page"
              pages.update(r)
              ranges.append((va,va+ms))
          assert any(a<=entry<b for a,b in ranges)
          print("PASS: disjoint 4KiB PT_LOAD pages; image span",max(b for a,b in ranges)-min(a for a,b in ranges))
          PY
          sha256sum evidence/hello.elf evidence/hello-page.elf > evidence/elf.sha256
          echo 'PASS: stock static FreeBSD CRT/libc ELF linked (not runtime execution)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exodus-stock-freebsd-libc-baseline
          path: evidence/
          if-no-files-found: warn
