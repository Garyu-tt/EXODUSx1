name: Tumor Stage-2 isolation reference
on:
  pull_request:
    paths:
      - 'exodus/frankenstein/el2_stage2_reference.S'
      - 'exodus/frankenstein/el2_stage2_reference.ld'
      - 'exodus/frankenstein/EL2_STAGE2.md'
      - '.github/workflows/tumor-el2-stage2.yml'
permissions:
  contents: read
jobs:
  stage2-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu qemu-system-arm
      - run: |
          set -eu
          src=exodus/frankenstein
          aarch64-linux-gnu-as -march=armv8-a "$src/el2_stage2_reference.S" -o "$RUNNER_TEMP/s2.o"
          aarch64-linux-gnu-ld -T "$src/el2_stage2_reference.ld" "$RUNNER_TEMP/s2.o" -o "$RUNNER_TEMP/s2.elf"
          for mode in on off; do
            rc=0
            timeout 8s qemu-system-aarch64 -machine virt,virtualization=$mode -cpu cortex-a57 -smp 1 -m 128M -nographic -monitor none -serial stdio -net none -d int,guest_errors -D "$RUNNER_TEMP/$mode.trace" -kernel "$RUNNER_TEMP/s2.elf" > "$RUNNER_TEMP/$mode.log" 2>&1 || rc=$?
            cat "$RUNNER_TEMP/$mode.log"
            tail -c 8192 "$RUNNER_TEMP/$mode.trace"
            test "$rc" = 124
            if [ "$mode" = on ]; then expected=EXODUS_S2_REF_PASS; else expected=EXODUS_S2_REF_EL1_BLOCKED; fi
            test "$(grep -c '^EXODUS_S2_REF_' "$RUNNER_TEMP/$mode.log")" = 1
            tr -d '\r' < "$RUNNER_TEMP/$mode.log" | grep -Fx "$expected"
          done
