name: Wizard Update

on:
  pull_request:
    paths:
      - '.github/workflows/wizard-release.yml'
      - 'Old files/4ifir Wizard source code/**'
      - 'Old files/4IFIR-Wizard-update/4IFIR Wizard/**'
      - 'exodus/build_wizard_release.py'
      - 'tests/test_wizard_release.py'
  workflow_dispatch:

jobs:
  build:
    name: Build and verify legacy Wizard package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
      archive: ${{ steps.package.outputs.archive }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test archive layout and contents
        run: python -m unittest discover -s tests -p test_wizard_release.py -v
      - name: Build release archive
        id: package
        run: |
          version=$(date -u '+%y.%m.%d.%H')
          archive=$(python exodus/build_wizard_release.py --version "$version" --output-dir dist)
          printf 'version=%s\narchive=%s\n' "$version" "$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: wizard-update
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          overwrite: true

  draft-release:
    name: Create legacy Wizard release draft
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wizard-update
          path: dist
      - uses: softprops/action-gh-release@v3.0.4
        with:
          draft: true
          tag_name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ needs.build.outputs.archive }}
          fail_on_unmatched_files: true
