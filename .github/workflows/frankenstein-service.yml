name: Tumor session service validation
on:
  pull_request:
    paths:
      - 'exodus/frankenstein/graph.json'
      - 'exodus/frankenstein/validate_graph.py'
      - 'exodus/frankenstein/partition_contract.py'
      - 'exodus/frankenstein/ipc_contract.py'
      - 'exodus/frankenstein/ipc_native.c'
      - 'exodus/frankenstein/el_probe.S'
      - 'exodus/frankenstein/el_probe.ld'
      - 'exodus/frankenstein/bao_guest.S'
      - 'exodus/frankenstein/bao_guest.ld'
      - 'exodus/frankenstein/bao_reference.c'
      - 'exodus/frankenstein/test_ipc_process.py'
      - 'exodus/frankenstein/sessiond.c'
      - 'exodus/frankenstein/test_sessiond.py'
      - 'exodus/frankenstein/sessiond-dbus.inc'
      - 'exodus/frankenstein/test_sessiond_dbus.sh'
      - 'exodus/frankenstein/test_dbus_contract.py'
      - '.github/workflows/frankenstein-service.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: |
          python3 exodus/frankenstein/validate_graph.py
          python3 exodus/frankenstein/partition_contract.py
          python3 exodus/frankenstein/ipc_contract.py
          python3 -W error::ResourceWarning exodus/frankenstein/test_ipc_process.py
          cc -std=c11 -Wall -Wextra -Werror -pedantic -DTMR_SELFTEST -fsanitize=address,undefined -fno-sanitize-recover=all exodus/frankenstein/ipc_native.c -o /tmp/tumor-ipc-native
          ASAN_OPTIONS=detect_leaks=1 /tmp/tumor-ipc-native
          cc -std=c11 -Wall -Wextra -Werror -O2 exodus/frankenstein/sessiond.c -o /tmp/exodus-sessiond
          python3 exodus/frankenstein/test_sessiond.py /tmp/exodus-sessiond
      - name: Install native GLib and D-Bus test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libglib2.0-bin dbus-daemon
      - name: Test upstream session interface subset on an isolated bus
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -DEXODUS_DBUS exodus/frankenstein/sessiond.c $(pkg-config --cflags --libs gio-2.0) -o /tmp/exodus-sessiond-dbus
          dbus-run-session -- sh exodus/frankenstein/test_sessiond_dbus.sh /tmp/exodus-sessiond-dbus
          dbus-run-session -- python3 exodus/frankenstein/test_dbus_contract.py /tmp/exodus-sessiond-dbus

  reference-el:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install reference tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld qemu-system-arm
      - name: Build and check reference privilege contexts
        run: |
          set -eu
          clang --target=aarch64-none-elf -march=armv8-a -ffreestanding -c exodus/frankenstein/el_probe.S -o /tmp/el-probe.o
          ld.lld --no-undefined -T exodus/frankenstein/el_probe.ld /tmp/el-probe.o -o /tmp/el-probe.elf
          test -z "$(nm -u /tmp/el-probe.elf)"
          for mode in on off; do
            rc=0
            timeout 12s qemu-system-aarch64 -machine "virt,virtualization=$mode,gic-version=2,secure=off" -cpu cortex-a57 -smp 1 -m 128 -display none -monitor none -serial stdio -no-reboot -kernel /tmp/el-probe.elf > "/tmp/el-$mode.log" 2>&1 || rc=$?
            cat "/tmp/el-$mode.log"
            test "$rc" -eq 124
            expected=EL2
            if [ "$mode" = off ]; then expected=EL1_BLOCKED; fi
            test "$(grep -c '^TUMOR_REF:' "/tmp/el-$mode.log")" -eq 1
            grep -qx "TUMOR_REF: $expected" "/tmp/el-$mode.log"
          done

  bao-reference-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install isolated cross toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu clang lld
      - name: Build synthetic guests and pinned Bao reference
        run: |
          set -eu
          src="$GITHUB_WORKSPACE/exodus/frankenstein"
          out="$(mktemp -d /tmp/tumor-bao.XXXXXX)"
          mkdir "$out/config"
          cp "$src/bao_reference.c" "$out/config/tumor.c"
          for role in A B; do
            clang --target=aarch64-none-elf -march=armv8-a -ffreestanding -DGUEST_$role -c "$src/bao_guest.S" -o "$out/guest-$role.o"
            ld.lld --no-undefined -T "$src/bao_guest.ld" "$out/guest-$role.o" -o "$out/guest-$role.elf"
            ld.lld --oformat=binary -T "$src/bao_guest.ld" "$out/guest-$role.o" -o "$out/guest-$role.bin"
            test -z "$(nm -u "$out/guest-$role.elf")"
          done
          git init "$out/bao"
          git -C "$out/bao" remote add origin https://github.com/bao-project/bao-hypervisor.git
          git -C "$out/bao" fetch --depth=1 origin 0af4a1ab558ad60c9658af4f43756c4536dd3141
          git -C "$out/bao" checkout --detach FETCH_HEAD
          test "$(git -C "$out/bao" rev-parse HEAD)" = 0af4a1ab558ad60c9658af4f43756c4536dd3141
          make -C "$out/bao" -j2 CROSS_COMPILE=aarch64-linux-gnu- PLATFORM=qemu-aarch64-virt CONFIG_REPO="$out/config" CONFIG=tumor CPPFLAGS="-DTUMOR_IMAGES=$out"
          elf="$out/bao/bin/qemu-aarch64-virt/tumor/bao.elf"
          test -s "$elf"
          readelf -h "$elf" | grep AArch64
          sha256sum "$elf" "$out/bao/bin/qemu-aarch64-virt/tumor/bao.bin"
          echo "Reference build only: no runtime or hardware admission"
