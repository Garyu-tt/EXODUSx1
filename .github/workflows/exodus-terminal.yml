name: EXODUS terminal
on:
  pull_request:
    paths:
      - 'exodus/terminal/**'
      - '.github/workflows/exodus-terminal.yml'
  push:
    branches: [main]
    paths:
      - 'exodus/terminal/**'
      - '.github/workflows/exodus-terminal.yml'
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s exodus/terminal -v
      - name: Test bounded BSD pipe provider
        run: |
          "$CC" -std=gnu11 -Wall -Wextra -Werror -pthread -fsanitize=undefined exodus/terminal/nxbsd_pipe.c exodus/terminal/test_nxbsd_pipe.c -o "$RUNNER_TEMP/test-nxbsd-pipe"
          timeout 15s "$RUNNER_TEMP/test-nxbsd-pipe"
      - name: Test owned BSD descriptors
        run: |
          "$CC" -std=gnu11 -Wall -Wextra -Werror -pthread -fsanitize=undefined exodus/terminal/nxbsd_pipe.c exodus/terminal/nxbsd_fd.c exodus/terminal/test_nxbsd_fd.c -o "$RUNNER_TEMP/test-nxbsd-fd"
          timeout 15s "$RUNNER_TEMP/test-nxbsd-fd"
      - name: Test per-task BSD context
        run: |
          "$CC" -std=gnu11 -Wall -Wextra -Werror -pthread -fsanitize=undefined exodus/terminal/nxbsd_pipe.c exodus/terminal/nxbsd_fd.c exodus/terminal/nxbsd_context.c exodus/terminal/test_nxbsd_context.c -o "$RUNNER_TEMP/test-nxbsd-context"
          timeout 15s "$RUNNER_TEMP/test-nxbsd-context"
      - name: Test BSD task scheduler
        run: |
          "$CC" -std=gnu11 -Wall -Wextra -Werror -pthread -fsanitize=undefined exodus/terminal/nxbsd_pipe.c exodus/terminal/nxbsd_fd.c exodus/terminal/nxbsd_context.c exodus/terminal/nxbsd_task.c exodus/terminal/test_nxbsd_task.c -o "$RUNNER_TEMP/test-nxbsd-task"
          timeout 15s "$RUNNER_TEMP/test-nxbsd-task"
      - name: Test BSD pipeline executor
        run: |
          "$CC" -std=gnu11 -Wall -Wextra -Werror -pthread -fsanitize=undefined exodus/terminal/nxbsd_pipe.c exodus/terminal/nxbsd_fd.c exodus/terminal/nxbsd_context.c exodus/terminal/nxbsd_task.c exodus/terminal/nxbsd_pipeline.c exodus/terminal/test_nxbsd_pipeline.c -o "$RUNNER_TEMP/test-nxbsd-pipeline"
          timeout 15s "$RUNNER_TEMP/test-nxbsd-pipeline"
