name: Tumor HOS userland probe build
on:
  pull_request:
    paths:
      - 'tools/tumor-hos-probe/**'
      - '.github/workflows/tumor-hos-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: make -C tools/tumor-hos-probe
      - run: sha256sum tools/tumor-hos-probe/tumor-hos-probe.nro
      - uses: actions/upload-artifact@v4
        with:
          name: tumor-hos-probe
          path: tools/tumor-hos-probe/tumor-hos-probe.nro
          if-no-files-found: error
