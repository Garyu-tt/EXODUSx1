name: EXODUS CorkDeck shell validation

on:
  pull_request:
    paths:
      - 'exodus/home/corkdeck/**'
      - 'exodus/home/ulaunch/catalog*'
      - 'exodus/runtime/autorun_probe*'
      - 'exodus/tests/evcs_discovery_test.c'
      - 'exodus/tests/evcs_split_test.c'
      - '.github/workflows/exodus-corkdeck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install SDL and image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libpng-dev libturbojpeg0-dev nlohmann-json3-dev fonts-dejavu-core
      - name: Checkout exact donor source
        run: |
          git init "$RUNNER_TEMP/corkdeck"
          git -C "$RUNNER_TEMP/corkdeck" remote add origin https://github.com/Garyu-tt/CorkDeck.git
          git -C "$RUNNER_TEMP/corkdeck" sparse-checkout set horizon-wine/source
          git -C "$RUNNER_TEMP/corkdeck" fetch --depth=1 --filter=blob:none origin adc0b52284e9e57d18808427a770a2a162c76bf0
          git -C "$RUNNER_TEMP/corkdeck" checkout --detach FETCH_HEAD
      - name: Portable tests
        run: |
          set -eu
          dir=exodus/home/corkdeck
          for test in horizon_settings launch_route runtime_handoff library_filter shell_menu control_metrics; do
            cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
              "$dir/test_$test.c" -o "$RUNNER_TEMP/test-$test"
            "$RUNNER_TEMP/test-$test"
          done
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            "$dir/test_windows_pe.c" "$dir/windows_pe.c" -o "$RUNNER_TEMP/test-windows-pe"
          "$RUNNER_TEMP/test-windows-pe"
          cc -std=c11 -Wall -Wextra -Werror exodus/tests/evcs_discovery_test.c -o "$RUNNER_TEMP/test-evcs"
          "$RUNNER_TEMP/test-evcs"
          cc -std=c11 -Wall -Wextra -Werror -D_FILE_OFFSET_BITS=64 exodus/tests/evcs_split_test.c -o "$RUNNER_TEMP/test-evcs-split"
          "$RUNNER_TEMP/test-evcs-split"
          cc -std=c11 -Wall -Wextra -Werror -c exodus/runtime/autorun_probe.c -o "$RUNNER_TEMP/autorun-probe.o"
          c++ -std=c++17 -Wall -Wextra -Werror -I /usr/include/nlohmann \
            "$dir/test_library_catalog.cpp" "$dir/library_catalog.cpp" exodus/home/ulaunch/catalog.cpp \
            "$RUNNER_TEMP/autorun-probe.o" -o "$RUNNER_TEMP/test-catalog"
          "$RUNNER_TEMP/test-catalog" "$RUNNER_TEMP/catalog-fixture.json"
      - name: Build and render home
        run: |
          sh exodus/home/corkdeck/build-host.sh "$RUNNER_TEMP/corkdeck" "$RUNNER_TEMP/exodus-shell"
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            timeout 30 "$RUNNER_TEMP/exodus-shell" /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf --smoke

  native:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare host headers and verify the image's Switch portlibs
        run: |
          apt-get update
          apt-get install -y git pkg-config nlohmann-json3-dev file
          export PKG_CONFIG_PATH=
          export PKG_CONFIG_LIBDIR="$DEVKITPRO/portlibs/switch/lib/pkgconfig:$DEVKITPRO/portlibs/switch/share/pkgconfig"
          pkg-config --modversion sdl2 SDL2_ttf libpng libturbojpeg
      - name: Checkout exact donor source
        run: |
          git init /tmp/corkdeck
          git -C /tmp/corkdeck remote add origin https://github.com/Garyu-tt/CorkDeck.git
          git -C /tmp/corkdeck sparse-checkout set horizon-wine/source
          git -C /tmp/corkdeck fetch --depth=1 --filter=blob:none origin adc0b52284e9e57d18808427a770a2a162c76bf0
          git -C /tmp/corkdeck checkout --detach FETCH_HEAD
      - name: Compile native shell and validate NRO
        run: |
          sh exodus/home/corkdeck/build-switch.sh /tmp/corkdeck /tmp/exodus-build
          cc -std=c11 -Wall -Wextra -Werror exodus/home/corkdeck/check_shell_nro.c exodus/runtime/autorun_probe.c -o /tmp/check-shell-nro
          /tmp/check-shell-nro /tmp/exodus-build/exodus-shell.nro
          dd if=/dev/zero of=/tmp/magic-only.nro bs=128 count=1 status=none
          printf 'NRO0' | dd of=/tmp/magic-only.nro bs=1 seek=16 conv=notrunc status=none
          if /tmp/check-shell-nro /tmp/magic-only.nro; then
            echo 'NRO preflight accepted an incomplete header' >&2
            exit 1
          fi
          file /tmp/exodus-build/exodus-shell.elf
          cd /tmp/exodus-build
          sha256sum exodus-shell.nro > SHA256SUMS
          cat SHA256SUMS
      - name: Publish tested native shell
        uses: actions/upload-artifact@v4
        with:
          name: exodus-shell-switch-arm64
          path: |
            /tmp/exodus-build/exodus-shell.nro
            /tmp/exodus-build/SHA256SUMS
          if-no-files-found: error
          retention-days: 30



  tools:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: terminal
            revision: 9dd382c56259447cd86fff0f38da063de9e25f30
          - tool: ssh
            revision: 8021faf0c02e6411c2c4b8d8d162a584291690ac
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build NRO structural checker
        run: cc -std=c11 -Wall -Wextra -Werror exodus/home/corkdeck/check_shell_nro.c exodus/runtime/autorun_probe.c -o /tmp/check-shell-nro
      - name: Install SDK packages
        env:
          TOOL: ${{ matrix.tool }}
        run: |
          # The devkita64 image already includes the SDK used by terminal.
          test -x "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-gcc"
          test -f "$DEVKITPRO/libnx/switch.specs"
          if [ "$TOOL" = ssh ]; then
            export PKG_CONFIG_PATH=
            export PKG_CONFIG_LIBDIR="$DEVKITPRO/portlibs/switch/lib/pkgconfig:$DEVKITPRO/portlibs/switch/share/pkgconfig"
            if ! pkg-config --exists libssh2; then
              # First use the existing package database, then refresh once.
              dkp-pacman -S --noconfirm --needed switch-libssh2 ||
                dkp-pacman -Syu --noconfirm --needed switch-libssh2
            fi
            pkg-config --exists libssh2
          fi
      - name: Build pinned native tool
        env:
          TOOL: ${{ matrix.tool }}
          REVISION: ${{ matrix.revision }}
        run: |
          set -eu
          git init /tmp/exodus-tool-source
          git -C /tmp/exodus-tool-source remote add origin https://github.com/Garyu-tt/EXODUSx1.git
          git -C /tmp/exodus-tool-source sparse-checkout set "exodus/$TOOL"
          git -C /tmp/exodus-tool-source fetch --depth=1 origin "$REVISION"
          git -C /tmp/exodus-tool-source checkout --detach FETCH_HEAD
          if [ "$TOOL" = ssh ]; then
            export PKG_CONFIG_PATH=
            export PKG_CONFIG_LIBDIR="$DEVKITPRO/portlibs/switch/lib/pkgconfig:$DEVKITPRO/portlibs/switch/share/pkgconfig"
            make -C "/tmp/exodus-tool-source/exodus/$TOOL" SSH_LIBS="$(pkg-config --static --libs libssh2)"
          else
            make -C "/tmp/exodus-tool-source/exodus/$TOOL"
          fi
          mkdir -p "/tmp/exodus-tools/switch/exodus-$TOOL"
          cp "/tmp/exodus-tool-source/exodus/$TOOL/exodus-$TOOL.nro" "/tmp/exodus-tools/switch/exodus-$TOOL/"
          cd /tmp/exodus-tools
          /tmp/check-shell-nro "switch/exodus-$TOOL/exodus-$TOOL.nro"
          sha256sum "switch/exodus-$TOOL/exodus-$TOOL.nro" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: exodus-native-${{ matrix.tool }}-switch-arm64
          path: /tmp/exodus-tools/
          if-no-files-found: error
          retention-days: 30
