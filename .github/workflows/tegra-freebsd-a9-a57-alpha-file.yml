name: EXODUS combined Alpha 2 reproducible kit R97
on:
  push:
    branches:
      - integration/exodus-alpha-c-file
  pull_request:
    paths:
      - '.github/workflows/tegra-freebsd-a9-a57-alpha-file.yml'
      - 'exodus/tests/a57_file_c_fixture.c'
      - 'exodus/tests/a57_native_file_reference.h'
      - 'exodus/tests/test_a57_file_abi.c'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  file-abi-host:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: File ABI regression tests
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          "$CC" -DFIO_HOST_TEST -std=c11 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -no-pie exodus/tests/test_a57_file_abi.c exodus/tests/a57_file_c_fixture.c -o file-abi-host
          ./file-abi-host
          ./file-abi-host preopen
          ./file-abi-host c
  memory:
    needs: file-abi-host
    runs-on: ubuntu-latest
    env:
      RAM_MIB: '512'
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: a9-reduced-source-build
          run-id: '46045173543'
          github-token: ${{ github.token }}
          path: prior
      - name: Prepare pinned source-built kernel
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-utils dosfstools mtools python3-pexpect gcc-aarch64-linux-gnu libc6-dev-arm64-cross gcc-arm-linux-gnueabihf device-tree-compiler python3 curl xz-utils expect clang lld
          mkdir -p evidence
          python3 exodus/tests/tumor_freebsd_source_load.py prior/kernel.elf evidence --sha256 e32e0e0120720464ef0789e4e3d6d85fb823a34fb63d3e7e16c8dba5b51b312f --ram-mib "$RAM_MIB" | tee evidence/load-plan.log
          test "$(cat evidence/entry.txt)" = 0x61000200
          arm-linux-gnueabihf-objdump -d --disassemble=gem5_devmap_init prior/kernel.elf | tee evidence/source-devmap.log
          arm-linux-gnueabihf-gcc -mcpu=cortex-a9 -marm -c exodus/tests/tumor_freebsd_direct_a9.S -o handoff.o
          arm-linux-gnueabihf-ld -Ttext=0x60010000 -e _start handoff.o -o handoff.elf
          arm-linux-gnueabihf-objcopy -O binary handoff.elf handoff.bin
          python3 - <<'PY'
          import os,pathlib
          source=pathlib.Path("exodus/tests/tumor_a9_root_reference.dts").read_text()
          old="reg = <0x60000000 0x40000000>;"
          assert source.count(old)==1
          ram=int(os.environ["RAM_MIB"])
          assert source.count("FreeBSD: vfs.root.mountfrom=")==1
          source=source.replace("FreeBSD: vfs.root.mountfrom=", "FreeBSD: -s vfs.root.mountfrom=")
          pathlib.Path("evidence/board.dts").write_text(source.replace(old, f"reg = <0x60000000 {ram*1024*1024:#x}>;"))
          PY
          dtc -I dts -O dtb -o evidence/board.dtb evidence/board.dts
          fdtget -t x evidence/board.dtb /memory@60000000 reg | tee evidence/memory-map.log
      - name: Download verified disposable root disk
        run: |
          image=FreeBSD-15.1-RELEASE-arm-armv7-GENERICSD.img
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 300 "https://download.freebsd.org/releases/arm/armv7/ISO-IMAGES/15.1/$image.xz" -o "$image.xz"
          printf '%s  %s\n' d568d7324825af9072405b11b7d0f4ba892d10ca05687fe4fd65e328e72cf7b8 "$image.xz" | sha256sum -c -
          printf '%s  %s\n' a50077a25a44a38cf3ff55b0a6e3da839ea96b829e5d975f27e1f3c0a6f0f68ef97a7d5ce845f3f0d76fce800814e57ff9c3499d518257210eb7e32913c720f5 "$image.xz" | sha512sum -c -
          xz -dk "$image.xz"
      - uses: actions/checkout@v4
        with:
          ref: fb86a126fb7c9f04476a3a429bdacbf5ab38a9e8
          path: authority
          persist-credentials: false
      - name: Prepare existing native process authority and A57 fixture
        run: |
          set -euo pipefail
          src="$PWD/authority/exodus/frankenstein"
          test "$(git -C authority rev-parse HEAD)" = fb86a126fb7c9f04476a3a429bdacbf5ab38a9e8
          /usr/bin/python3 "$src/armv7_authority/test_serial_patterns.py"
          mv FreeBSD-15.1-RELEASE-arm-armv7-GENERICSD.img disk.raw
          qemu-img resize -f raw disk.raw 12G
          curl -fL --retry 3 https://download.freebsd.org/releases/arm64/aarch64/15.1-RELEASE/src.txz -o src.txz
          printf '%s  src.txz\n' cf5762da53fd52e1eaf0f9ceee9bf58cbe314c821031d0d9ffa76823185a89e1 | sha256sum -c -
          truncate -s 512M seed.img
          mkfs.vfat -n EXODUSSEED seed.img
          mcopy -i seed.img src.txz "$src/amp_execution_contract.c" "$src/armv7_authority/"{exodus_amp1.c,Makefile,test_kernel_amp.c,guest.sh,awt_clone_relay.c,awt_clone_guest.sh,exodus_awt_clone.c,Makefile.awtclone} "$src/amp_wait_contract.h" "$src/amp_spawn_contract.h" ::
          cp exodus/tests/a57_native_file_reference.h "$src/armv7_authority/"
          cat > file-c.ld <<'EOF'
          ENTRY(file_c_entry)
          SECTIONS {
            . = 0x1800;
            .text : { KEEP(*(.text.entry)) *(.text .text.*) *(.rodata .rodata.*) }
            /DISCARD/ : { *(.comment) *(.note*) *(.eh_frame*) }
            ASSERT(SIZEOF(.text) <= 2048, "C fixture exceeds guest code slot")
          }
          EOF
          clang --target=aarch64-unknown-freebsd15.1 -march=armv8-a -mgeneral-regs-only -ffreestanding -fno-builtin -fno-stack-protector -fno-pic -fno-pie -fno-unwind-tables -fno-asynchronous-unwind-tables -O2 -Wall -Wextra -Werror -c exodus/tests/a57_file_c_fixture.c -o file-c.o
          ld.lld -T file-c.ld --build-id=none -o file-c.elf file-c.o
          aarch64-linux-gnu-objcopy -O binary file-c.elf a57-file-c.bin
          test "$(wc -c < a57-file-c.bin)" -le 2048
          aarch64-linux-gnu-readelf -h -S -r file-c.elf > evidence/file-c-layout.log
          aarch64-linux-gnu-objdump -d file-c.elf > evidence/file-c-disassembly.log
          test -z "$(aarch64-linux-gnu-nm -u file-c.elf)"
          python3 - <<'PY'
          from pathlib import Path
          base=Path("authority/exodus/frankenstein")
          p=base/"armv7_authority/awt_clone_relay.c"
          s=p.read_text()
          s='#include "a57_native_file_reference.h"\n'+s
          old='    for(unsigned i=0;i<N;i++)assert(phase[i]==4);'
          assert s.count(old)==1
          s=s.replace(old,r'''    for(unsigned j=0;j<7;j++){
                  char line[130];uint8_t q[64],r[64];
                  assert(fgets(line,sizeof line,stdin)&&strlen(line)==129&&line[128]=='\n');
                  for(unsigned i=0;i<64;i++){int h=nibble(line[i*2]),l=nibble(line[i*2+1]);assert(h>=0&&l>=0);q[i]=(uint8_t)((h<<4)|l);}
                  assert(fio(q,r));
                  fputs("EXODUS_FILE_REPLY ",stdout);
                  for(unsigned i=0;i<64;i++)printf("%02x",r[i]);
                  putchar('\n');fflush(stdout);
              }
              puts("EXODUS_NATIVE_FILE_PASS");
          '''+old)
          p.write_text(s)
          p=base/"armv7_authority/awt_clone_guest.sh"
          s=p.read_text()
          old=" /mnt/exodus-seed/amp_spawn_contract.h awt/"
          assert s.count(old)==1
          p.write_text(s.replace(old," /mnt/exodus-seed/amp_spawn_contract.h /mnt/exodus-seed/a57_native_file_reference.h awt/"))
          p=base/"awt_clone_bridge.c"
          s=p.read_text()+r'''
          uint64_t clone_graphics(uint64_t x,uint64_t y,uint64_t w,uint64_t h,uint64_t color){
              if(x>=16||y>=12||!w||!h||w>16-x||h>12-y||color>0xffffff)return 0;
              uint8_t q[64]={65,71,88,49,1,1},r[64];
              q[8]=x;q[9]=y;q[10]=w;q[11]=h;q[12]=color>>16;q[13]=color>>8;q[14]=color;
              uint64_t hz;__asm__ volatile("mrs %0,cntfrq_el0":"=r"(hz));if(!hz)return 0;
              uint64_t t=tick();
              for(unsigned i=0;i<64;i++){
                  while(UART[6]&(1u<<5))if(tick()-t>=hz*2)return 0;
                  UART[0]=q[i];
              }
              for(unsigned i=0;i<64;i++){
                  while(UART[6]&(1u<<4))if(tick()-t>=hz*2)return 0;
                  uint32_t v=UART[0];if(v&0xf00u)return 0;r[i]=(uint8_t)v;
              }
              q[5]=2;q[24]=q[12];q[25]=q[13];q[26]=q[14];q[27]=255;
              q[28]=0x14;q[29]=0x20;q[30]=0x30;q[31]=255;
              q[32]=1;q[33]=1;q[34]=2;
              if(memcmp(q,r,64))return 0;
              return (uint64_t)r[32]|((uint64_t)r[33]<<8)|((uint64_t)r[34]<<16);
          }
          static unsigned fio_seq;
          uint64_t clone_fio(uint64_t op,uint64_t fd,uint64_t ptr,uint64_t n,uint8_t *page){
              uint8_t q[64]={65,70,73,49,1,1},r[64];
              if(fio_seq>=7)return UINT64_MAX;
              if(op==5){
                  if(fd!=0x2020||ptr!=(fio_seq?0:0xa02)||n!=(fio_seq?0:0600)||memcmp(page+32,"data",5))return UINT64_MAX;
                  n=0;
              }else if(op==6){if(fd!=3)return UINT64_MAX;n=0;}
              else if(op==3||op==4){
                  if(fd!=3||n!=8||ptr!=(op==4?0x2030:0x2040))return UINT64_MAX;
                  if(op==4)memcpy(q+32,page+48,8);
              }else return UINT64_MAX;
              q[6]=op;q[8]=++fio_seq;q[9]=n;
              uint64_t hz;__asm__ volatile("mrs %0,cntfrq_el0":"=r"(hz));if(!hz)return UINT64_MAX;
              uint64_t t=tick();
              for(unsigned i=0;i<64;i++){while(UART[6]&(1u<<5))if(tick()-t>=hz*2)return UINT64_MAX;UART[0]=q[i];}
              for(unsigned i=0;i<64;i++){while(UART[6]&(1u<<4))if(tick()-t>=hz*2)return UINT64_MAX;uint32_t v=UART[0];if(v&0xf00)return UINT64_MAX;r[i]=v;}
              q[5]=2;q[7]=r[7];q[10]=r[10];
              if(memcmp(q,r,32)||r[10]>16||(r[7]&&r[10]))return UINT64_MAX;
              unsigned used=op==3&&!r[7]?r[10]:0;
              for(unsigned i=32+used;i<64;i++)if(r[i])return UINT64_MAX;
              if(op==3&&!r[7]){if(used>n)return UINT64_MAX;memcpy(page+64,r+32,used);}
              return ((uint64_t)r[7]<<32)|r[10];
          }
          '''
          p.write_text(s)
          p=base/"awt_clone_reference.S"
          s=p.read_text()
          old="    cmp x0,#7\n    b.eq parent_wait\n    b fail"
          assert s.count(old)==1
          s=s.replace(old,"    cmp x0,#7\n    b.eq parent_wait\n    cmp x0,#3\n    b.eq file_call\n    cmp x0,#4\n    b.eq file_call\n    cmp x0,#5\n    b.eq file_call\n    cmp x0,#6\n    b.eq file_call\n    cmp x0,#4089\n    b.eq file_done\n    cmp x0,#4088\n    b.eq graphics_call\n    cmp x0,#4087\n    b.eq graphics_done\n    b fail")
          old="    adr x1,passed\n    b report"
          assert s.count(old)==1
          s=s.replace(old,r'''    adr x0,phase
              mov x1,#3
              str x1,[x0]
              b restore
          file_call:
              adr x4,phase
              ldr x5,[x4]
              cmp x5,#3
              b.ne fail
              ldr x0,[sp,#64]
              ldp x1,x2,[sp]
              ldr x3,[sp,#16]
              adr x4,pages
              bl clone_fio
              cmn x0,#1
              b.eq fail
              lsr x1,x0,#32
              mrs x2,spsr_el1
              cbnz x1,file_error
              bic x2,x2,#(1<<29)
              b file_return
          file_error:
              orr x2,x2,#(1<<29)
              mov x0,x1
          file_return:
              msr spsr_el1,x2
              str x0,[sp]
              b restore
          file_done:
              adr x0,phase
              ldr x1,[x0]
              cmp x1,#3
              b.ne fail
              adr x1,phase
              mov x2,#4
              str x2,[x1]
              adr x0,graphics_user
              adr x1,user_code
              sub x0,x0,x1
              add x0,x0,#0x1000
              msr elr_el1,x0
              b restore
          graphics_call:
              adr x0,phase
              ldr x1,[x0]
              cmp x1,#4
              b.ne fail
              ldp x0,x1,[sp,#0]
              ldp x2,x3,[sp,#16]
              ldr x4,[sp,#32]
              bl clone_graphics
              cbz x0,fail
              str x0,[sp]
              adr x1,phase
              mov x2,#5
              str x2,[x1]
              b restore
          graphics_done:
              adr x0,phase
              ldr x1,[x0]
              cmp x1,#5
              b.ne fail
              adr x1,passed
              b report''')
          old="    mov x8,#4091\n    svc #0\nbad:"
          assert s.count(old)==1
          s=s.replace(old,r'''    mov x8,#4091
              svc #0
              b file_c_entry
          graphics_user:
              mov x0,#2
              mov x1,#3
              mov x2,#5
              mov x3,#4
              movz x4,#0x3456
              movk x4,#0x12,lsl #16
              mov x8,#4088
              svc #0
              movz x1,#0x0101
              movk x1,#2,lsl #16
              cmp x0,x1
              b.ne bad
              mov x8,#4087
              svc #0
          bad:''')
          old="    b bad\n.balign 4096\nservice_vectors:"
          assert s.count(old)==1
          s=s.replace(old,r'''    b bad
              .ltorg
              .space 2048-(.-user_code)
          file_c_entry:
              .incbin "a57-file-c.bin"
              .balign 4096
          service_vectors:''')
          p.write_text(s)
          PY
          mcopy -o -i seed.img "$src/armv7_authority/"{awt_clone_relay.c,awt_clone_guest.sh,a57_native_file_reference.h} ::
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all tools/kernel_bridge/a57_display_reference.c -o "$PWD/display-reference"
          aarch64-linux-gnu-gcc -march=armv8-a -mgeneral-regs-only -mstrict-align -ffreestanding -fno-builtin -fno-stack-protector -fno-pie -no-pie -static -nostdlib -O2 -Wl,--build-id=none,--fatal-warnings -T "$src/el2_freebsd_abi_reference.ld" "$src/awt_clone_reference.S" "$src/awt_clone_bridge.c" -o amp.elf
      - name: Prepare resident SSH and storage fixture
        run: |
          set -euo pipefail
          cat > services.sh <<'EOF'
          #!/bin/sh
          set -eu
          d=/var/tmp/exodus-services
          mkdir -m 700 "$d"
          test "$(uname -s)" = FreeBSD
          uname -v | grep EXODUS_A9_REF
          sysctl -n hw.model | grep -i cortex-a9
          mkdir -p "$d/storage"
          printf '%s\n' 'EXODUS persistent test' > "$d/storage/payload"
          hash=$(sha256 -q "$d/storage/payload")
          sync
          mv "$d/storage/payload" "$d/storage/committed"
          test "$(sha256 -q "$d/storage/committed")" = "$hash"
          echo EXODUS_STORAGE_PASS
          ifconfig lo0 inet 127.0.0.1 up
          ping -c 1 -t 5 127.0.0.1
          echo EXODUS_LOOPBACK_PASS
          # Single-user boot has not initialized /etc/rc services.
          step=account
          trap 'rc=$?; echo "EXODUS_RESIDENT_RESULT=$rc stage=$step"; if test "$rc" != 0 && test -s "$d/sshd.pid"; then kill "$(cat "$d/sshd.pid")" 2>/dev/null || :; fi' EXIT
          mkdir -p /home /var/run /var/empty
          test -w /etc/master.passwd
          pw useradd -n exodusprobe -u 60001 -m -s /bin/sh -w random > "$d/pw.log" 2>&1 || { cat "$d/pw.log" >&2; exit 1; }
          rm -f "$d/pw.log"
          test "$(id -u exodusprobe)" = 60001
          echo EXODUS_ACCOUNT_PASS
          step=keys
          ssh-keygen -q -t ed25519 -N '' -f "$d/host"
          ssh-keygen -q -t ed25519 -N '' -f "$d/client"
          echo EXODUS_KEYS_PASS
          step=config
          mkdir -p /var/run
          if ! test -d /var/empty; then
              install -d -o root -g wheel -m 755 /var/empty
          fi
          # Preserve FreeBSD's protected (schg) privilege separation directory.
          test ! -L /var/empty
          ls -ldo /var/empty
          test "$(stat -f %u /var/empty)" = 0
          mode=$(stat -f %Lp /var/empty)
          test "$((0$mode & 022))" = 0
          cp "$d/client.pub" /home/exodusprobe/authorized_keys
          chown exodusprobe /home/exodusprobe/authorized_keys
          chmod 600 /home/exodusprobe/authorized_keys
          awk '{print "[127.0.0.1]:2222 "$1" "$2}' "$d/host.pub" > "$d/known_hosts"
          cat > "$d/sshd.conf" <<CONF
          Port 2222
          ListenAddress 127.0.0.1
          AddressFamily inet
          HostKey $d/host
          PidFile $d/sshd.pid
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          AuthorizedKeysFile %h/authorized_keys
          UsePAM no
          PermitEmptyPasswords no
          AllowTcpForwarding no
          AllowAgentForwarding no
          X11Forwarding no
          PermitTunnel no
          AllowUsers exodusprobe
          PermitTTY no
          PermitUserRC no
          CONF
          client() {
              ssh -F /dev/null -4 -T -p 2222 -i "$d/client" \
                  -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=5 \
                  -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known_hosts" \
                  -o GlobalKnownHostsFile=/dev/null exodusprobe@127.0.0.1 "$@"
          }
          start_server() {
              step=sshd-config
              /usr/sbin/sshd -t -e -f "$d/sshd.conf"
              step=sshd-launch
              /usr/sbin/sshd -E "$d/sshd.log" -f "$d/sshd.conf" || { cat "$d/sshd.log" >&2; return 1; }
              step=sshd-pid
              i=0
              while ! test -s "$d/sshd.pid"; do
                  i=$((i+1))
                  if test "$i" -ge 15; then cat "$d/sshd.log" >&2; return 1; fi
                  sleep 1
              done
              kill -0 "$(cat "$d/sshd.pid")" || { cat "$d/sshd.log" >&2; return 1; }
              step=sshd-listen
              sockstat -4 -l | grep ':2222' || { cat "$d/sshd.log" >&2; return 1; }
          }
          stop_server() {
              pid=$(cat "$d/sshd.pid")
              kill "$pid"
              i=0
              while kill -0 "$pid" 2>/dev/null; do
                  i=$((i+1))
                  test "$i" -lt 20
                  sleep 1
              done
              rm -f "$d/sshd.pid"
          }
          start_server
          echo EXODUS_SSHD_STARTED
          step=auth
          test "$(client 'id -u')" = 60001
          rc=0
          client 'exit 23' || rc=$?
          test "$rc" = 23
          echo EXODUS_SSH_AUTH_PASS
          step=restart
          stop_server
          rc=0
          client 'exit 0' || rc=$?
          test "$rc" = 255
          start_server
          test "$(client 'printf "%s" EXODUS_RESTART_OK')" = EXODUS_RESTART_OK
          echo EXODUS_SERVICE_RESTART_PASS
          sync
          echo EXODUS_RESIDENT_SSH_READY
          EOF
          cat > probe.sh <<'EOF'
          #!/bin/sh
          set -eu
          d=/var/tmp/exodus-services
          result=$(ssh -n -F /dev/null -4 -T -p 2222 -i "$d/client" \
              -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=5 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known_hosts" \
              -o GlobalKnownHostsFile=/dev/null exodusprobe@127.0.0.1 'id -u')
          test "$result" = 60001
          EOF
          sh -n services.sh
          sh -n probe.sh
          mcopy -i seed.img services.sh probe.sh ::
          python3 - <<'PY'
          from pathlib import Path
          p=Path("authority/exodus/frankenstein/armv7_authority/awt_clone_relay.c")
          s=p.read_text()
          old='reply:\n        fputs'
          assert s.count(old)==1
          s=s.replace(old,'reply:\n        assert(system("/bin/sh /var/tmp/exodus-ssh-probe.sh")==0);\n        puts("EXODUS_SSH_DURING_A57_PASS");\n        fputs')
          p.write_text(s)
          PY
          mcopy -o -i seed.img authority/exodus/frankenstein/armv7_authority/awt_clone_relay.c ::
      - name: Adapt only boot profile of pinned dual-VM runner
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("authority/exodus/frankenstein/armv7_authority/awt_clone_run.py")
          s=p.read_text()
          start=s.index('cmd=["qemu-system-arm"')
          end=s.index('with open(log,',start)
          s=s[:start]+'''cmd=["qemu-system-arm","-M","vexpress-a9","-cpu","cortex-a9","-m","512",
               "-smp","1","-display","none","-serial","stdio","-monitor","none",
               "-no-reboot","-nic","none",
               "-device","loader,file=evidence/kernel.bin,addr=0x61000000,force-raw=on",
               "-device","loader,file=evidence/board.dtb,addr=0x60040000,force-raw=on",
               "-device","loader,file=handoff.bin,addr=0x60010000,cpu-num=0,force-raw=on",
               "-drive",f"if=none,file={disk},format=raw,id=system,snapshot=on",
               "-device","virtio-blk-device,drive=system",
               "-drive",f"if=none,file={seed},format=raw,id=seed,readonly=on",
               "-device","virtio-blk-device,drive=seed"]
          '''+s[end:]
          start=s.index('        child.expect(r"login:"')
          end=s.index('        child.sendline("test $(id -u)',start)
          s=s[:start]+r'''        deadline=time.monotonic()+180
                  while True:
                      event=child.expect([r"mountroot> *",r"Enter full pathname of shell or RETURN for /bin/sh: *",r"(?i)panic:"],timeout=max(1,deadline-time.monotonic()))
                      if event==0:
                          child.sendline("ufs:/dev/ufs/rootfs")
                      elif event==1:
                          child.sendline("")
                          break
                      else:
                          raise RuntimeError("A9 kernel panic")
                  child.expect(r"(?m)^(root@[^\r\n]* )?# *$",timeout=90)
                  child.sendline("uname -v | grep EXODUS_A9_REF && sysctl -n hw.model | grep -i cortex-a9 && mount -uw / && printf 'EXODUS_A9_%s\\n' ID_PASS")
                  child.expect(r"(?m)^EXODUS_A9_ID_PASS\r*\n",timeout=90)
                  child.expect(r"(?m)^(root@[^\r\n]* )?# *$",timeout=30)
                  child.sendline("service growfs onestart && df -h / && printf 'EXODUS_A9_%s\\n' ROOT_READY")
                  child.expect(r"(?m)^EXODUS_A9_ROOT_READY\r*\n",timeout=180)
                  child.expect(r"(?m)^(root@[^\r\n]* )?# *$",timeout=30)
          '''+s[end:]
          old='        child.sendline("shutdown -p now")\n        child.expect(pexpect.EOF,timeout=180)'
          assert s.count(old)==1
          s=s.replace(old,'        child.sendline("sync")\n        child.expect(r"# ",timeout=30)')
          # Stop the disposable emulator through the host, not guest poweroff.
          # pexpect's short signal grace period can fail while QEMU flushes.
          old='        child.close(force=True)'
          assert s.count(old)==1
          s=s.replace(old,'''        import os, signal
                  if child.isalive():
                      child.kill(signal.SIGTERM)
                      stop=time.monotonic()+10
                      while child.isalive() and time.monotonic()<stop:
                          time.sleep(0.1)
                      if child.isalive():
                          child.kill(signal.SIGKILL)
                          stop=time.monotonic()+10
                          while child.isalive() and time.monotonic()<stop:
                              time.sleep(0.1)
                  if child.isalive():
                      raise RuntimeError("A9 emulator did not terminate")
                  child.close(force=False)''')
          # Set up the service before entering the AWT relay, on the same VM.
          old='        child.sendline("mount -t msdosfs -o ro /dev/msdosfs/EXODUSSEED /mnt/exodus-seed && cp /mnt/exodus-seed/awt_clone_guest.sh'
          assert s.count(old)==1
          insert=r'''        child.sendline("mount -t msdosfs -o ro /dev/msdosfs/EXODUSSEED /mnt/exodus-seed && cp /mnt/exodus-seed/probe.sh /var/tmp/exodus-ssh-probe.sh && sh /mnt/exodus-seed/services.sh && umount /mnt/exodus-seed && printf 'EXODUS_RESIDENT_%s\\n' SETUP_PASS")
                  result=child.expect([r"(?m)^EXODUS_RESIDENT_SETUP_PASS\r*\n",r"(?m)^EXODUS_RESIDENT_RESULT=[1-9][0-9]* stage=[a-z-]+\r*\n"],timeout=180)
                  if result!=0: raise RuntimeError(child.match.group(0))
                  child.expect(r"(?m)^(root@[^\r\n]* )?# *$",timeout=30)
          '''
          s=s.replace(old,insert+old)
          old='        deadline=time.monotonic()+30'
          assert s.count(old)==1
          s=s.replace(old,'        deadline=time.monotonic()+180')
          old='                child.expect(r"(?m)^EXODUS_LIVE_REPLY'
          assert s.count(old)==1
          s=s.replace(old,r'''                child.expect(r"(?m)^EXODUS_SSH_DURING_A57_PASS\r*\n",timeout=30)
          '''+old)
          old='            marker=b"EXODUS_LIVE_CLONE_PASS\\n"'
          assert s.count(old)==1
          s=s.replace(old,r'''            for i,(op,n,result,err) in enumerate([(5,0,3,0),(4,8,8,0),(6,0,0,0),(5,0,3,0),(3,8,8,0),(6,0,0,0),(3,8,0,9)],1):
                          q=read_exact(vm.stdout,64,deadline)
                          data=b"87654321" if op==4 else b""
                          expected=b"AFI1"+bytes([1,1,op,0,i,n])+bytes(22)+data+bytes(32-len(data))
                          assert q==expected
                          child.sendline(q.hex())
                          child.expect(r"(?m)^EXODUS_FILE_REPLY ([0-9a-f]{128})\r*\n",timeout=5)
                          r=bytes.fromhex(child.match.group(1))
                          data=b"87654321" if op==3 and not err else b""
                          expected=b"AFI1"+bytes([1,2,op,err,i,n,result])+bytes(21)+data+bytes(32-len(data))
                          assert r==expected
                          write_all(vm.stdin,r)
                      child.expect(r"(?m)^EXODUS_NATIVE_FILE_PASS\r*\n",timeout=30)
                      print("PASS: native FreeBSD file open/write/close/reopen/read and EBADF",flush=True)
                      q=read_exact(vm.stdout,64,deadline)
                      expected=b"AGX1"+bytes([1,1,0,0,2,3,5,4,0x12,0x34,0x56])+bytes(49)
                      assert q==expected
                      path=pathlib.Path(log).parent/"a57-frame.rgba"
                      p=subprocess.run(["./display-reference",str(path)],input=q,capture_output=True,check=True,timeout=5)
                      expected_pixels=bytes(v for y in range(12) for x in range(16)
                                            for v in ((0x12,0x34,0x56,255) if 2<=x<7 and 3<=y<7 else (0x14,0x20,0x30,255)))
                      assert path.read_bytes()==expected_pixels
                      assert len(p.stdout)==64 and p.stdout[32:35]==bytes([1,1,2])
                      write_all(vm.stdin,p.stdout)
                      print("PASS: A57 EL0 display request rendered through existing compositor",flush=True)
          '''+old)
          for kind in ("11 [Hypervisor Call]", "2 [SVC]"):
              old=f'assert lines.count("Taking exception {kind} on CPU 0")==5'
              assert s.count(old)==1
              s=s.replace(old,old[:-1]+"15")
          p.write_text(s)
          compile(s,str(p),"exec")
          PY
      - name: Execute source-built A9 and A57 process lifecycle
        run: |
          set -euo pipefail
          /usr/bin/python3 authority/exodus/frankenstein/armv7_authority/awt_clone_run.py disk.raw seed.img unused evidence/serial.log amp.elf evidence/a57-trace.log
          tr -d '\r' < evidence/serial.log > evidence/normalized.log
          for marker in EXODUS_A9_ID_PASS EXODUS_STORAGE_PASS EXODUS_LOOPBACK_PASS EXODUS_SSH_AUTH_PASS EXODUS_SERVICE_RESTART_PASS EXODUS_RESIDENT_SSH_READY EXODUS_RESIDENT_SETUP_PASS EXODUS_NATIVE_FILE_PASS; do
            test "$(grep -Fxc "$marker" evidence/normalized.log)" = 1
          done
          test "$(grep -Fxc EXODUS_SSH_DURING_A57_PASS evidence/normalized.log)" = 4
          test "$(wc -c < evidence/a57-frame.rgba)" = 768
      - name: Assemble reproducible dual-CPU kit
        run: |
          set -euo pipefail
          kit=exodus-alpha2-reference
          mkdir -p "$kit/evidence" "$kit/runner/armv7_authority" "$kit/display"
          cp evidence/kernel.bin evidence/board.dtb evidence/board.dts "$kit/evidence/"
          cp handoff.bin amp.elf file-c.elf FreeBSD-15.1-RELEASE-arm-armv7-GENERICSD.img.xz "$kit/"
          cp authority/exodus/frankenstein/armv7_authority/awt_clone_run.py "$kit/runner/armv7_authority/"
          cp authority/exodus/frankenstein/test_el2_freebsd_abi.py "$kit/runner/"
          cp tools/kernel_bridge/{a57_display_reference.c,framebuffer_adapter.h,compositor.h} "$kit/display/"
          xz -T2 -1 -c seed.img > "$kit/seed.img.xz"
          printf '%s\n' "$GITHUB_SHA" > "$kit/workflow-commit.txt"
          printf '%s\n' fb86a126fb7c9f04476a3a429bdacbf5ab38a9e8 > "$kit/authority-commit.txt"
          cat > "$kit/run.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          cd -- "$(dirname -- "$0")"
          sha256sum -c SHA256SUMS
          for exe in qemu-system-arm qemu-system-aarch64 qemu-img xz python3 timeout cc; do
            command -v "$exe" >/dev/null || { echo "Missing dependency: $exe" >&2; exit 2; }
          done
          python3 -c 'import pexpect'
          kit="$PWD"
          out=$(mktemp -d "$kit/results.XXXXXXXX")
          tmp=$(mktemp -d)
          trap 'rm -rf -- "$tmp"' EXIT
          xz -dc FreeBSD-15.1-RELEASE-arm-armv7-GENERICSD.img.xz > "$tmp/disk.raw"
          qemu-img resize -f raw "$tmp/disk.raw" 12G
          xz -dc seed.img.xz > "$tmp/seed.img"
          for path in handoff.bin amp.elf evidence runner; do
            ln -s "$kit/$path" "$tmp/$path"
          done
          cd -- "$tmp"
          cc -std=c11 -Wall -Wextra -Werror -pedantic "$kit/display/a57_display_reference.c" -o display-reference
          timeout 45m python3 runner/armv7_authority/awt_clone_run.py disk.raw seed.img unused "$out/serial.log" amp.elf "$out/a57-trace.log" | tee "$out/result.log"
          tr -d '\r' < "$out/serial.log" > "$out/normalized.log"
          for marker in EXODUS_A9_ID_PASS EXODUS_STORAGE_PASS EXODUS_LOOPBACK_PASS EXODUS_SSH_AUTH_PASS EXODUS_SERVICE_RESTART_PASS EXODUS_RESIDENT_SSH_READY EXODUS_RESIDENT_SETUP_PASS EXODUS_NATIVE_FILE_PASS; do
            test "$(grep -Fxc "$marker" "$out/normalized.log")" = 1
          done
          test "$(grep -Fxc EXODUS_SSH_DURING_A57_PASS "$out/normalized.log")" = 4
          test "$(wc -c < "$out/a57-frame.rgba")" = 768
          grep -Fxq 'PASS: native FreeBSD file open/write/close/reopen/read and EBADF' "$out/result.log"
          grep -Fxq 'PASS: A57 EL0 display request rendered through existing compositor' "$out/result.log"
          python3 - "$out/a57-frame.rgba" "$out/a57-frame.ppm" <<'PY'
          import pathlib,sys
          data=pathlib.Path(sys.argv[1]).read_bytes()
          assert len(data)==16*12*4 and all(x==255 for x in data[3::4])
          pathlib.Path(sys.argv[2]).write_bytes(b'P6\n16 12\n255\n'+bytes(v for i,v in enumerate(data) if i%4!=3))
          PY
          grep -Fxq 'PASS: live native PID, A57 parent/child clone, private RW, native exit status and ECHILD' "$out/result.log"
          printf 'Logs: %s\n' "$out"
          EOF
          cat > "$kit/README.txt" <<'EOF'
          EXODUS Alpha 2 reference integration for QEMU, not Switch firmware.
          Linux dependencies: qemu-system-arm, qemu-utils, python3-pexpect,
          xz-utils, bash, coreutils and a C compiler. Allow at least 15 GiB free temporary disk.
          Run: bash run.sh
          The kit uses a pinned FreeBSD ARMv7 release root, source-built
          EXODUS_A9_REF kernel (512 MiB), and A57 EL2/EL0 fixture (128 MiB).
          The original native FreeBSD modules are built in the disposable guest
          using the included pinned FreeBSD source archive on the FAT seed.
          The host relays bytes; it does not manufacture authority responses.
          The test checks native PID, clone isolation, wait/exit, ECHILD,
          key-authenticated loopback SSH, restart, four concurrent SSH probes,
          compiled C file open/write/close/reopen/read and EBADF,
          exact RGBA compositor output and injected pointer return to A57 EL0.
          Open results.*/a57-frame.ppm to view the actual 16x12 test frame.
          No external network, persistent disk writes or physical hardware.
          The included ELF is the bounded C file fixture, not a general BSD executable loader.
          No actual Horizon display, physical HID, arbitrary BSD apps or desktop.
          SSH is loopback only; no externally accessible server is provided.
          Upstream FreeBSD sources and distribution retain their own licenses.
          EOF
          chmod +x "$kit/run.sh"
          bash -n "$kit/run.sh"
          (
            cd "$kit"
            sha256sum README.txt run.sh workflow-commit.txt authority-commit.txt \
              evidence/kernel.bin evidence/board.dtb evidence/board.dts \
              handoff.bin amp.elf file-c.elf seed.img.xz \
              display/a57_display_reference.c display/framebuffer_adapter.h display/compositor.h \
              runner/armv7_authority/awt_clone_run.py runner/test_el2_freebsd_abi.py \
              FreeBSD-15.1-RELEASE-arm-armv7-GENERICSD.img.xz > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          tar -cf exodus-alpha2-reference.tar "$kit"
      - name: Re-run the actual packaged kit
        run: |
          set -euo pipefail
          mkdir -p packaged
          tar -xf exodus-alpha2-reference.tar -C packaged
          bash packaged/exodus-alpha2-reference/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: exodus-alpha2-reference-kit
          path: exodus-alpha2-reference.tar
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exodus-alpha-c-file-evidence
          path: |
            evidence/*.log
            evidence/a57-frame.rgba
            file-c.elf
          if-no-files-found: warn
