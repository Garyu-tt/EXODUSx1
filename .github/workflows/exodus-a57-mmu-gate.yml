              uint64_t lane=*thread;
              if(lane<1||lane>2)return 3;
              if(sp[1]!=(uintptr_t)sp+128||sp[2]!=(uintptr_t)sp+136||sp[4]!=(uintptr_t)sp+144)return 4;
              if(!eq((const char *)(uintptr_t)sp[1],"exodus")||
                 !eq((const char *)(uintptr_t)sp[2],lane==1?"lane-1":"lane-2")||
                 !eq((const char *)(uintptr_t)sp[4],"MODE=TEST"))return 5;
