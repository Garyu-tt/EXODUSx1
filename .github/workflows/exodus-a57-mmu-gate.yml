          cat > elf64_page_plan.c <<'R111_SRC'
          #include "elf64_page_plan.h"
          #include <string.h>
          #define MASK ((uint64_t)ELF64_PAGE-1)
          int elf64_page_plan(const struct elf64_plan *p,uint64_t lo,uint64_t hi,uint64_t top,size_t stack_pages,uint8_t *perm,size_t pages){
              if(!p||!perm||hi<=lo||((lo|hi|top)&MASK)||top>hi||top<=lo||
                 (hi-lo)/ELF64_PAGE!=pages||!stack_pages||stack_pages>=(top-lo)/ELF64_PAGE||
                 !p->count||p->count>ELF64_MAX_SEGMENTS||(p->entry&3))return 0;
              uint64_t bottom=top-(uint64_t)stack_pages*ELF64_PAGE,guard=bottom-ELF64_PAGE;
              uint64_t first[ELF64_MAX_SEGMENTS],last[ELF64_MAX_SEGMENTS];unsigned entry=0;
              for(size_t i=0;i<p->count;i++){
                  const struct elf64_segment *s=&p->seg[i];
                  if(s->va<lo||s->va>=hi||!s->memsz||s->filesz>s->memsz||s->memsz>hi-s->va||
                     (s->flags!=4&&s->flags!=5&&s->flags!=6))return 0;
                  first[i]=(s->va-lo)/ELF64_PAGE;
                  last[i]=(s->va-lo+s->memsz-1)/ELF64_PAGE+1;
                  if(first[i]<(top-lo)/ELF64_PAGE&&last[i]>(guard-lo)/ELF64_PAGE)return 0;
                  for(size_t j=0;j<i;j++)if(first[i]<last[j]&&first[j]<last[i])return 0;
                  if(s->flags==5&&p->entry>=s->va&&p->entry-s->va<s->filesz&&s->filesz-(p->entry-s->va)>=4)entry++;
              }
              if(entry!=1)return 0;
              memset(perm,0,pages);
              for(size_t i=0;i<p->count;i++)memset(perm+first[i],(int)p->seg[i].flags,(size_t)(last[i]-first[i]));
              memset(perm+(bottom-lo)/ELF64_PAGE,6,stack_pages);
              return 1;
          }
