          test "$(grep -Fxc R114_TLS_PASS ELF-MMU-RESULTS.txt)" = 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r104-mmu-gate-evidence
          path: |
            mmu-gate/
            elf-mmu-gate/
            start-gate/
            tls-gate/
          if-no-files-found: warn
