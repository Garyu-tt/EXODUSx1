name: EXODUS R106 isolated MMU runtime gate
on:
  push:
    branches: [integration/exodus-a57-mmu-gate]
    paths: ['.github/workflows/exodus-a57-mmu-gate.yml']
  pull_request:
    paths: ['.github/workflows/exodus-a57-mmu-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
