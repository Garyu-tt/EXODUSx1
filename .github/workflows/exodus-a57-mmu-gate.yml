              add x0,x0,:lo12:data_value
              ldr x1,[x0]
              cmp x1,#0x123
              b.ne bad
              ldr x2,[x0,#8]
              cbnz x2,bad
              adrp x3, ro_value
              add x3,x3,:lo12:ro_value
              ldr x4,[x3]
              cmp x4,#0x456
              b.ne bad
              mov x5,#0x789
              str x5,[x0,#8]
