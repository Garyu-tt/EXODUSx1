name: EXODUS R110 ELF-derived MMU runtime gate
on:
  push:
    branches: [integration/exodus-a57-mmu-gate]
    paths: ['.github/workflows/exodus-a57-mmu-gate.yml']
  pull_request:
    paths: ['.github/workflows/exodus-a57-mmu-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mmu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install emulator and compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-arm clang lld binutils
