          cat > bare/start_check.c <<'EOF'
          #include <stdint.h>
          static int eq(const char *a,const char *b){
              while(*a&&*a==*b){a++;b++;}
              return *a==*b;
          }
          int start_check(const uint64_t *sp){
              if(((uintptr_t)sp&15)||sp[0]!=2||sp[3]||sp[5]||
                 sp[6]!=6||sp[7]!=4096||sp[8]!=9||sp[9]!=0x201000||sp[10]||sp[11])return 1;
              uintptr_t tp;
