name: Tumor AMP execution reference
on:
  pull_request:
    paths:
      - 'exodus/frankenstein/amp_execution_contract.c'
      - '.github/workflows/tumor-amp-execution.yml'
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Native sanitizer contract
        run: |
          set -eu
          clang -std=c11 -Wall -Wextra -Werror -pedantic -DAMP_SELFTEST -fsanitize=address,undefined exodus/frankenstein/amp_execution_contract.c -o "$RUNNER_TEMP/amp"
          "$RUNNER_TEMP/amp"
      - name: Mixed-width cross build and execution
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu libc6-dev-armhf-cross libc6-dev-arm64-cross qemu-user
          src=exodus/frankenstein/amp_execution_contract.c
          arm-linux-gnueabihf-gcc -static -march=armv7-a -mfpu=vfpv3-d16 -O2 -std=c11 -Wall -Wextra -Werror -pedantic -DAMP_SELFTEST "$src" -o "$RUNNER_TEMP/amp32"
          aarch64-linux-gnu-gcc -static -march=armv8-a -O2 -std=c11 -Wall -Wextra -Werror -pedantic -DAMP_SELFTEST "$src" -o "$RUNNER_TEMP/amp64"
          qemu-arm -cpu cortex-a9 "$RUNNER_TEMP/amp32"
          qemu-aarch64 -cpu cortex-a57 "$RUNNER_TEMP/amp64"
