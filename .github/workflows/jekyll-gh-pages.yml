# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  pages-readiness:
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      deploy: ${{ steps.site.outputs.result }}
    steps:
      - name: Check Pages publishing source
        id: site
        uses: actions/github-script@v8
        with:
          result-encoding: string
          script: |
            let site;
            try {
              ({ data: site } = await github.rest.repos.getPages(context.repo));
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              // A 404 alone does not establish that Pages is disabled.
              const { data: repository } = await github.rest.repos.get(context.repo);
              if (repository.has_pages !== false) {
                throw error;
              }
              core.notice('GitHub Pages is disabled for this repository. Skipping deployment.');
              return 'false';
            }

            switch (site.build_type) {
              case 'workflow':
                return 'true';
              case 'legacy':
                core.notice('GitHub Pages uses branch publishing. Skipping deployment.');
                return 'false';
              default:
                throw new Error('Unexpected GitHub Pages build type.');
            }

  # Build job
  build:
    needs: pages-readiness
    if: needs.pages-readiness.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
