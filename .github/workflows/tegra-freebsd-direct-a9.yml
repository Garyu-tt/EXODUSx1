name: Tegra FreeBSD direct A9 kernel reference
on:
  workflow_dispatch:
  push:
    branches: [docs/tegra-research-evidence-r01]
    paths:
      - '.github/workflows/tegra-freebsd-direct-a9.yml'
      - 'exodus/tests/tumor_freebsd_direct_a9.*'
permissions:
  contents: read
jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install isolated tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-arm gcc-arm-linux-gnueabihf device-tree-compiler python3 curl xz-utils u-boot-qemu expect dosfstools mtools
      - name: Extract exact audited kernel and build direct handoff
        run: |
          set -o pipefail
          mkdir -p evidence
          image=FreeBSD-15.1-RELEASE-arm-armv7-GENERICSD.img
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 300 "https://download.freebsd.org/releases/arm/armv7/ISO-IMAGES/15.1/$image.xz" -o "$image.xz"
          printf '%s  %s\n' d568d7324825af9072405b11b7d0f4ba892d10ca05687fe4fd65e328e72cf7b8 "$image.xz" | sha256sum -c -
          printf '%s  %s\n' a50077a25a44a38cf3ff55b0a6e3da839ea96b829e5d975f27e1f3c0a6f0f68ef97a7d5ce845f3f0d76fce800814e57ff9c3499d518257210eb7e32913c720f5 "$image.xz" | sha512sum -c -
          xz -d "$image.xz"
          truncate -s 64M export.img
          mkfs.vfat -F 32 -n EXODUS export.img
          cat > extract.exp <<'EOF'
          set timeout 420
          spawn -noecho qemu-system-arm -M virt -cpu cortex-a15 -m 768 -smp 1 -nographic -monitor none -nic none -bios /usr/lib/u-boot/qemu_arm/u-boot.bin -drive if=virtio,file=FreeBSD-15.1-RELEASE-arm-armv7-GENERICSD.img,format=raw,snapshot=on -drive if=virtio,file=export.img,format=raw -no-reboot
          proc fail {message} {
              puts stderr $message
              catch {exec kill -TERM [exp_pid]}
              catch {close}
              catch {wait}
              exit 1
          }
          expect {
              -re {login: *$} {}
              timeout {fail "Extraction VM login timed out"}
              eof {fail "Extraction VM exited"}
          }
          set timeout 45
          send -- "root\r"
          expect {
              -re {Password: *$} {send -- "root\r"; exp_continue}
              -re {# *$} {}
              timeout {fail "Extraction VM shell unavailable"}
              eof {fail "Extraction VM exited"}
          }
          send -- {/bin/sh -c 'set -e; test "$(uname -s)" = FreeBSD; test "$(uname -p)" = armv7; mkdir -p /mnt/exodus; mount_msdosfs /dev/vtbd1 /mnt/exodus; cp /boot/kernel/kernel /mnt/exodus/KERNEL.ELF; sync; umount /mnt/exodus; printf "%s%s\n" EXODUS_KERNEL_EXPORT_ PASS'}
          send -- "\r"
          expect {
              -re {(?m)^EXODUS_KERNEL_EXPORT_PASS\r*$} {}
              timeout {fail "Kernel export failed"}
              eof {fail "Extraction VM exited before export"}
          }
          catch {exec kill -TERM [exp_pid]}
          catch {close}
          catch {wait}
          exit 0
          EOF
          timeout 9m expect extract.exp 2>&1 | tee evidence/extraction.log
          tr -d '\r' < evidence/extraction.log | grep -Fxq EXODUS_KERNEL_EXPORT_PASS
          mcopy -i export.img ::/KERNEL.ELF kernel.elf
          printf '%s  %s\n' 0c535d1cbe4640c676531b0a9fcca9eef704e008521d858541e72f9a88d2806d kernel.elf | sha256sum -c -
          python3 exodus/tests/tumor_freebsd_direct_a9.py kernel.elf evidence | tee evidence/load-plan.log
          arm-linux-gnueabihf-gcc -mcpu=cortex-a9 -marm -c exodus/tests/tumor_freebsd_direct_a9.S -o handoff.o
          arm-linux-gnueabihf-ld -Ttext=0x60010000 -e _start handoff.o -o handoff.elf
          arm-linux-gnueabihf-objcopy -O binary handoff.elf handoff.bin
          dtc -I dts -O dtb -o evidence/board.dtb exodus/tests/tumor_freebsd_direct_a9.dts
      - name: Attempt direct real kernel entry without EFI or root disk
        run: |
          set -o pipefail
          set +e
          timeout 60s qemu-system-arm -M vexpress-a9 -cpu cortex-a9 -m 1024 -smp 1 -nographic -monitor none -serial stdio -nic none -no-reboot -device loader,file=evidence/kernel.bin,addr=0x61000000,force-raw=on -device loader,file=evidence/board.dtb,addr=0x60040000,force-raw=on -device loader,file=handoff.bin,addr=0x60010000,cpu-num=0,force-raw=on 2>&1 | tee evidence/direct-boot.log
          status=${PIPESTATUS[0]}
          set -e
          echo "QEMU exit status: $status" | tee -a evidence/direct-boot.log
          case "$status" in 0|124) ;; *) exit 1;; esac
          grep -E 'FreeBSD 15\.1-RELEASE.*GENERIC arm' evidence/direct-boot.log
          echo 'PASS: actual FreeBSD kernel banner reached by direct ARM handoff'
      - name: Preserve experimental evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-direct-a9
          path: |
            evidence/*.log
            evidence/*.dtb
          if-no-files-found: warn
