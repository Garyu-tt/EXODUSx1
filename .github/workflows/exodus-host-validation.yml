name: EXODUS host validation

on:
  pull_request:
    paths:
      - 'exodus/**'
      - 'tests/**'
      - '.github/workflows/exodus-host-validation.yml'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -v
      - name: Test the memory probe with MSVC
        if: runner.os == 'Windows' && matrix.python == '3.12'
        working-directory: exodus/memory
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'The MSVC x64 build tools are unavailable' }
          $devShell = Join-Path $installation 'Common7\Tools\Launch-VsDevShell.ps1'
          & $devShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cl /nologo /W4 /WX /TC /Fe:page_probe.exe page_probe.c page_probe_stats.c page_codec.c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B test_probe.py ./page_probe.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /W4 /WX /TC /Fe:page_snapshot_probe.exe page_snapshot_probe.c page_snapshot.c page_codec.c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B test_snapshot_probe.py ./page_snapshot_probe.exe

  memory:
    name: Memory codec and probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: make -C exodus/memory check
      - name: Check out pinned EX-005 baseline
        uses: actions/checkout@v6
        with:
          ref: a000dba9cd71da1568134f6308bb67bc439f8506
          path: .qa-ex005-baseline
          persist-credentials: false
      - name: EX-005 host A/B correctness and indicative timing
        shell: bash
        run: |
          set -euo pipefail
          candidate="$GITHUB_WORKSPACE/exodus/memory"
          baseline="$GITHUB_WORKSPACE/.qa-ex005-baseline/exodus/memory"
          flags=(-O2 -std=c99 -Wall -Wextra -Wpedantic -Werror)
          cp "$candidate/bench_ex005.c" "$baseline/bench_ex005.c"
          cc "${flags[@]}" -I"$baseline" "$baseline/bench_ex005.c" "$baseline/page_codec.c" "$baseline/bdi_slab.c" -o "$RUNNER_TEMP/ex005-baseline"
          cc "${flags[@]}" -I"$candidate" "$candidate/bench_ex005.c" "$candidate/page_codec.c" "$candidate/bdi_slab.c" -o "$RUNNER_TEMP/ex005-candidate"
          # Record optimizer and machine-code evidence without gating timings.
          cc --version
          uname -m
          for variant in baseline candidate; do
            if [ "$variant" = baseline ]; then src="$baseline"; else src="$candidate"; fi
            cc "${flags[@]}" -fopt-info-vec-all="$RUNNER_TEMP/$variant-vector.txt" -c "$src/page_codec.c" -o "$RUNNER_TEMP/$variant-codec.o"
            echo "=== $variant fingerprint vectorization diagnostics ==="
            grep -E 'optimized:|not vectorized:' "$RUNNER_TEMP/$variant-vector.txt" | tail -n 100 || true
            objdump -d --disassemble=exodus_page_bdi_fingerprint "$RUNNER_TEMP/$variant-codec.o"
          done
          "$RUNNER_TEMP/ex005-baseline" > "$RUNNER_TEMP/baseline-first.csv"
          "$RUNNER_TEMP/ex005-candidate" > "$RUNNER_TEMP/candidate-second.csv"
          "$RUNNER_TEMP/ex005-candidate" > "$RUNNER_TEMP/candidate-first.csv"
          "$RUNNER_TEMP/ex005-baseline" > "$RUNNER_TEMP/baseline-second.csv"
          echo "Host A/B order 1 (not Tegra and not a performance gate)"
          python3 "$candidate/compare_ex005_bench.py" "$RUNNER_TEMP/baseline-first.csv" "$RUNNER_TEMP/candidate-second.csv"
          echo "Host A/B order 2 (not Tegra and not a performance gate)"
          python3 "$candidate/compare_ex005_bench.py" "$RUNNER_TEMP/baseline-second.csv" "$RUNNER_TEMP/candidate-first.csv"

  catalog:
    name: Catalog C++ host checks
    runs-on: ubuntu-latest
    env:
      JSON_INCLUDE: ${{ github.workspace }}/.ci-deps/json/single_include/nlohmann
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out the JSON dependency pinned by uLaunch 1.2.6
        uses: actions/checkout@v6
        with:
          repository: nlohmann/json
          ref: 55f93686c01528224f448c19128836e7df245f72
          path: .ci-deps/json
          sparse-checkout: single_include/nlohmann
          persist-credentials: false
      - name: Test the HOME catalog and refresh
        run: make -C exodus/home/ulaunch check CPPFLAGS="-I\"$JSON_INCLUDE\"" CXXFLAGS="-O2 -Werror"
      - name: Test the Switch Steam Sync host code
        run: make -C exodus/steam_switch check JSON_INCLUDE="$JSON_INCLUDE" HOST_FLAGS=-Werror
      - name: Test the Steam file verifier
        run: make -C exodus/steam_integrity check HOST_FLAGS=-Werror
