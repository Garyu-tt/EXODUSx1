name: Kernel Bridge process host tests
on:
  pull_request:
    paths:
      - 'tools/kernel_bridge/**'
      - '.github/workflows/kernel-bridge-process.yml'
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run real children
        env:
          CC: ${{ matrix.cc }}
        run: |
          "$CC" -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all tools/kernel_bridge/process_test.c -o "$RUNNER_TEMP/exodus-process"
          timeout 20s "$RUNNER_TEMP/exodus-process"
