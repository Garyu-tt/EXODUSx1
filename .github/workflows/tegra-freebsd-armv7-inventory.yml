name: Tegra FreeBSD ARMv7 kernel inventory
on:
  workflow_dispatch:
  push:
    branches: [docs/tegra-research-evidence-r01]
    paths: ['.github/workflows/tegra-freebsd-armv7-inventory.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install reference VM tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-arm u-boot-qemu curl xz-utils expect
      - name: Download and verify pinned release image
        run: |
          mkdir -p inventory
          cd inventory
          image=FreeBSD-15.1-RELEASE-arm-armv7-GENERICSD.img
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 300 "https://download.freebsd.org/releases/arm/armv7/ISO-IMAGES/15.1/$image.xz" -o "$image.xz"
          printf '%s  %s\n' a50077a25a44a38cf3ff55b0a6e3da839ea96b829e5d975f27e1f3c0a6f0f68ef97a7d5ce845f3f0d76fce800814e57ff9c3499d518257210eb7e32913c720f5 "$image.xz" | sha512sum -c -
          printf '%s  %s\n' d568d7324825af9072405b11b7d0f4ba892d10ca05687fe4fd65e328e72cf7b8 "$image.xz" | sha256sum -c -
          xz -d "$image.xz"
      - name: Boot release and inventory actual kernel
        working-directory: inventory
        run: |
          set -o pipefail
          cat > boot.exp <<'EOF'
          set timeout 420
          spawn -noecho qemu-system-arm -M virt -cpu cortex-a15 -m 768 -smp 1 -nographic -monitor none -nic none -bios /usr/lib/u-boot/qemu_arm/u-boot.bin -drive if=virtio,file=FreeBSD-15.1-RELEASE-arm-armv7-GENERICSD.img,format=raw,snapshot=on -no-reboot
          proc fail {message} {
              puts stderr $message
              catch {exec kill -TERM [exp_pid]}
              catch {close}
              catch {wait}
              exit 1
          }
          expect {
              -re {login: *$} {}
              timeout {fail "ARMv7 login timed out"}
              eof {fail "ARMv7 exited before login"}
          }
          set timeout 45
          send -- "root\r"
          expect {
              -re {Password: *$} {send -- "root\r"; exp_continue}
              -re {# *$} {}
              -re {Login incorrect} {fail "ARMv7 login rejected"}
              timeout {fail "ARMv7 shell unavailable"}
              eof {fail "ARMv7 exited"}
          }
          send -- {/bin/sh -c 'set -e; test "$(uname -s)" = FreeBSD; test "$(uname -p)" = armv7; uname -a; sysctl hw.model hw.physmem; sha256 /boot/kernel/kernel; readelf -h -l -A /boot/kernel/kernel; readelf -h /boot/kernel/kernel | grep -q ELF32; readelf -h /boot/kernel/kernel | grep -q ARM; printf "%s%s\n" EXODUS_KERNEL_INVENTORY_ PASS'}
          send -- "\r"
          expect {
              -re {(?m)^EXODUS_KERNEL_INVENTORY_PASS\r*$} {}
              timeout {fail "ARMv7 kernel inventory failed"}
              eof {fail "ARMv7 exited before inventory"}
          }
          send -- {/bin/sh -c 'dmesg | grep -Ei "cpu0|gic|timer|uart|virtio|real memory|avail memory"; printf "%s%s\n" EXODUS_DEVICE_INVENTORY_ PASS'}
          send -- "\r"
          expect {
              -re {(?m)^EXODUS_DEVICE_INVENTORY_PASS\r*$} {}
              timeout {fail "ARMv7 device inventory failed"}
              eof {fail "ARMv7 exited before device inventory"}
          }
          catch {exec kill -TERM [exp_pid]}
          catch {close}
          catch {wait}
          exit 0
          EOF
          timeout 10m expect boot.exp | tee boot.log
          tr -d '\r' < boot.log > inventory.log
          grep -Fxq EXODUS_KERNEL_INVENTORY_PASS inventory.log
          grep -Fxq EXODUS_DEVICE_INVENTORY_PASS inventory.log
      - name: Preserve kernel inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-armv7-kernel-inventory
          path: inventory/*.log
          if-no-files-found: warn
