name: EXODUS compositor native framebuffer
on:
  pull_request:
    paths:
      - 'tools/kernel_bridge/**'
      - '.github/workflows/exodus-framebuffer-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          set -eu
          for cc in gcc clang; do
            "$cc" -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all tools/kernel_bridge/framebuffer_adapter_test.c -o /tmp/fb-test
            /tmp/fb-test
          done
  native:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          set -eu
          d=/opt/devkitpro
          "$d/devkitA64/bin/aarch64-none-elf-gcc" -O2 -Wall -Wextra -march=armv8-a+crc+crypto -mtune=cortex-a57 -mtp=soft -fPIE -D__SWITCH__ -I"$d/libnx/include" -specs="$d/libnx/switch.specs" tools/kernel_bridge/framebuffer_nro.c -L"$d/libnx/lib" -lnx -o framebuffer.elf
          "$d/tools/bin/nacptool" --create "EXODUS Framebuffer" "InfraCare-IT" "1.0" framebuffer.nacp
          "$d/tools/bin/elf2nro" framebuffer.elf framebuffer.nro --nacp=framebuffer.nacp
          sha256sum framebuffer.nro > framebuffer.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: exodus-native-framebuffer
          path: |
            framebuffer.nro
            framebuffer.sha256
          if-no-files-found: error
