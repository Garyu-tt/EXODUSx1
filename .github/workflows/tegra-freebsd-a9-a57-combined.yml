name: EXODUS combined functional reference R77
on:
  pull_request:
    paths:
      - '.github/workflows/tegra-freebsd-a9-a57-combined.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  memory:
    runs-on: ubuntu-latest
    env:
      RAM_MIB: '512'
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: a9-reduced-source-build
          run-id: '46045173543'
          github-token: ${{ github.token }}
          path: prior
      - name: Prepare pinned source-built kernel
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-utils dosfstools mtools python3-pexpect gcc-aarch64-linux-gnu libc6-dev-arm64-cross gcc-arm-linux-gnueabihf device-tree-compiler python3 curl xz-utils expect clang lld
          mkdir -p evidence
          python3 exodus/tests/tumor_freebsd_source_load.py prior/kernel.elf evidence --sha256 e32e0e0120720464ef0789e4e3d6d85fb823a34fb63d3e7e16c8dba5b51b312f --ram-mib "$RAM_MIB" | tee evidence/load-plan.log
          test "$(cat evidence/entry.txt)" = 0x61000200
          arm-linux-gnueabihf-objdump -d --disassemble=gem5_devmap_init prior/kernel.elf | tee evidence/source-devmap.log
          arm-linux-gnueabihf-gcc -mcpu=cortex-a9 -marm -c exodus/tests/tumor_freebsd_direct_a9.S -o handoff.o
          arm-linux-gnueabihf-ld -Ttext=0x60010000 -e _start handoff.o -o handoff.elf
          arm-linux-gnueabihf-objcopy -O binary handoff.elf handoff.bin
          python3 - <<'PY'
          import os,pathlib
          source=pathlib.Path("exodus/tests/tumor_a9_root_reference.dts").read_text()
          old="reg = <0x60000000 0x40000000>;"
          assert source.count(old)==1
          ram=int(os.environ["RAM_MIB"])
          assert source.count("FreeBSD: vfs.root.mountfrom=")==1
          source=source.replace("FreeBSD: vfs.root.mountfrom=", "FreeBSD: -s vfs.root.mountfrom=")
          pathlib.Path("evidence/board.dts").write_text(source.replace(old, f"reg = <0x60000000 {ram*1024*1024:#x}>;"))
          PY
          dtc -I dts -O dtb -o evidence/board.dtb evidence/board.dts
          fdtget -t x evidence/board.dtb /memory@60000000 reg | tee evidence/memory-map.log
      - name: Download verified disposable root disk
        run: |
          image=FreeBSD-15.1-RELEASE-arm-armv7-GENERICSD.img
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 300 "https://download.freebsd.org/releases/arm/armv7/ISO-IMAGES/15.1/$image.xz" -o "$image.xz"
          printf '%s  %s\n' d568d7324825af9072405b11b7d0f4ba892d10ca05687fe4fd65e328e72cf7b8 "$image.xz" | sha256sum -c -
          printf '%s  %s\n' a50077a25a44a38cf3ff55b0a6e3da839ea96b829e5d975f27e1f3c0a6f0f68ef97a7d5ce845f3f0d76fce800814e57ff9c3499d518257210eb7e32913c720f5 "$image.xz" | sha512sum -c -
          xz -dk "$image.xz"
      - uses: actions/checkout@v4
        with:
          ref: fb86a126fb7c9f04476a3a429bdacbf5ab38a9e8
          path: authority
          persist-credentials: false
      - name: Prepare existing native process authority and A57 fixture
        run: |
          set -euo pipefail
          src="$PWD/authority/exodus/frankenstein"
          test "$(git -C authority rev-parse HEAD)" = fb86a126fb7c9f04476a3a429bdacbf5ab38a9e8
          /usr/bin/python3 "$src/armv7_authority/test_serial_patterns.py"
          mv FreeBSD-15.1-RELEASE-arm-armv7-GENERICSD.img disk.raw
          qemu-img resize -f raw disk.raw 12G
          curl -fL --retry 3 https://download.freebsd.org/releases/arm64/aarch64/15.1-RELEASE/src.txz -o src.txz
          printf '%s  src.txz\n' cf5762da53fd52e1eaf0f9ceee9bf58cbe314c821031d0d9ffa76823185a89e1 | sha256sum -c -
          truncate -s 512M seed.img
          mkfs.vfat -n EXODUSSEED seed.img
          mcopy -i seed.img src.txz "$src/amp_execution_contract.c" "$src/armv7_authority/"{exodus_amp1.c,Makefile,test_kernel_amp.c,guest.sh,awt_clone_relay.c,awt_clone_guest.sh,exodus_awt_clone.c,Makefile.awtclone} "$src/amp_wait_contract.h" "$src/amp_spawn_contract.h" ::
          python3 - <<'PY'
          from pathlib import Path
          base=Path("authority/exodus/frankenstein")
          p=base/"awt_clone_bridge.c"
          s=p.read_text()+r'''
          /* Reference graphics operation, not a FreeBSD syscall. */
          uint64_t clone_graphics(uint64_t x,uint64_t y,uint64_t w,uint64_t h,uint64_t color){
              if(x>=16||y>=12||!w||!h||w>16-x||h>12-y||color>0xffffff)return 0;
              uint8_t q[64]={65,71,88,49,1,1},r[64];
              q[8]=x;q[9]=y;q[10]=w;q[11]=h;q[12]=color>>16;q[13]=color>>8;q[14]=color;
              uint64_t hz;__asm__ volatile("mrs %0,cntfrq_el0":"=r"(hz));if(!hz)return 0;
              uint64_t t=tick();
              for(unsigned i=0;i<64;i++){
                  while(UART[6]&(1u<<5))if(tick()-t>=hz*2)return 0;
                  UART[0]=q[i];
              }
              for(unsigned i=0;i<64;i++){
                  while(UART[6]&(1u<<4))if(tick()-t>=hz*2)return 0;
                  uint32_t v=UART[0];if(v&0xf00u)return 0;r[i]=(uint8_t)v;
              }
              q[5]=2;q[24]=q[12];q[25]=q[13];q[26]=q[14];q[27]=255;
              q[28]=0x14;q[29]=0x20;q[30]=0x30;q[31]=255;
              q[32]=1;q[33]=1;q[34]=2;
              if(memcmp(q,r,64))return 0;
              return (uint64_t)r[32]|((uint64_t)r[33]<<8)|((uint64_t)r[34]<<16);
          }
          '''
          p.write_text(s)
          p=base/"awt_clone_reference.S"
          s=p.read_text()
          old="    adr x1,passed\n    b report"
          assert s.count(old)==1
          s=s.replace(old,"    ldp x0,x1,[sp,#0]\n    ldp x2,x3,[sp,#16]\n    ldr x4,[sp,#32]\n    bl clone_graphics\n    cbz x0,fail\n    str x0,[sp]\n    adr x1,phase\n    mov x2,#3\n    str x2,[x1]\n    b restore\ngraphics_done:\n    adr x0,phase\n    ldr x1,[x0]\n    cmp x1,#3\n    b.ne fail\n    adr x1,passed\n    b report")
          old="    mov x8,#4091\n    svc #0"
          assert s.count(old)==1
          s=s.replace(old,"    mov x0,#2\n    mov x1,#3\n    mov x2,#5\n    mov x3,#4\n    movz x4,#0x3456\n    movk x4,#0x12,lsl #16\n    mov x8,#4091\n    svc #0\n    movz x1,#0x0101\n    movk x1,#2,lsl #16\n    cmp x0,x1\n    b.ne bad\n    mov x8,#4089\n    svc #0")
          old="    cmp x0,#4091\n    b.eq parent_done\n    cmp x0,#7"
          assert s.count(old)==1
          s=s.replace(old,"    cmp x0,#4091\n    b.eq parent_done\n    cmp x0,#4089\n    b.eq graphics_done\n    cmp x0,#7")
          p.write_text(s)
          PY
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all tools/kernel_bridge/a57_display_reference.c -o "$PWD/display-reference"
          aarch64-linux-gnu-gcc -march=armv8-a -mgeneral-regs-only -mstrict-align -ffreestanding -fno-builtin -fno-stack-protector -fno-pie -no-pie -static -nostdlib -O2 -Wl,--build-id=none,--fatal-warnings -T "$src/el2_freebsd_abi_reference.ld" "$src/awt_clone_reference.S" "$src/awt_clone_bridge.c" -o amp.elf
      - name: Prepare resident SSH and storage fixture
        run: |
          set -euo pipefail
          cat > services.sh <<'EOF'
          #!/bin/sh
          set -eu
          d=/var/tmp/exodus-services
          mkdir -m 700 "$d"
          test "$(uname -s)" = FreeBSD
          uname -v | grep EXODUS_A9_REF
          sysctl -n hw.model | grep -i cortex-a9
          mkdir -p "$d/storage"
          printf '%s\n' 'EXODUS persistent test' > "$d/storage/payload"
          hash=$(sha256 -q "$d/storage/payload")
          sync
          mv "$d/storage/payload" "$d/storage/committed"
          test "$(sha256 -q "$d/storage/committed")" = "$hash"
          echo EXODUS_STORAGE_PASS
          ifconfig lo0 inet 127.0.0.1 up
          ping -c 1 -t 5 127.0.0.1
          echo EXODUS_LOOPBACK_PASS
          # Single-user boot has not initialized /etc/rc services.
          step=account
          trap 'rc=$?; echo "EXODUS_RESIDENT_RESULT=$rc stage=$step"; if test "$rc" != 0 && test -s "$d/sshd.pid"; then kill "$(cat "$d/sshd.pid")" 2>/dev/null || :; fi' EXIT
          mkdir -p /home /var/run /var/empty
          test -w /etc/master.passwd
          pw useradd -n exodusprobe -u 60001 -m -s /bin/sh -w random > "$d/pw.log" 2>&1 || { cat "$d/pw.log" >&2; exit 1; }
          rm -f "$d/pw.log"
          test "$(id -u exodusprobe)" = 60001
          echo EXODUS_ACCOUNT_PASS
          step=keys
          ssh-keygen -q -t ed25519 -N '' -f "$d/host"
          ssh-keygen -q -t ed25519 -N '' -f "$d/client"
          echo EXODUS_KEYS_PASS
          step=config
          mkdir -p /var/run
          if ! test -d /var/empty; then
              install -d -o root -g wheel -m 755 /var/empty
          fi
          # Preserve FreeBSD's protected (schg) privilege separation directory.
          test ! -L /var/empty
          ls -ldo /var/empty
          test "$(stat -f %u /var/empty)" = 0
          mode=$(stat -f %Lp /var/empty)
          test "$((0$mode & 022))" = 0
          cp "$d/client.pub" /home/exodusprobe/authorized_keys
          chown exodusprobe /home/exodusprobe/authorized_keys
          chmod 600 /home/exodusprobe/authorized_keys
          awk '{print "[127.0.0.1]:2222 "$1" "$2}' "$d/host.pub" > "$d/known_hosts"
          cat > "$d/sshd.conf" <<CONF
          Port 2222
          ListenAddress 127.0.0.1
          AddressFamily inet
          HostKey $d/host
          PidFile $d/sshd.pid
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          AuthorizedKeysFile %h/authorized_keys
          UsePAM no
          PermitEmptyPasswords no
          AllowTcpForwarding no
          AllowAgentForwarding no
          X11Forwarding no
          PermitTunnel no
          AllowUsers exodusprobe
          PermitTTY no
          PermitUserRC no
          CONF
          client() {
              ssh -F /dev/null -4 -T -p 2222 -i "$d/client" \
                  -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=5 \
                  -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known_hosts" \
                  -o GlobalKnownHostsFile=/dev/null exodusprobe@127.0.0.1 "$@"
          }
          start_server() {
              step=sshd-config
              /usr/sbin/sshd -t -e -f "$d/sshd.conf"
              step=sshd-launch
              /usr/sbin/sshd -E "$d/sshd.log" -f "$d/sshd.conf" || { cat "$d/sshd.log" >&2; return 1; }
              step=sshd-pid
              i=0
              while ! test -s "$d/sshd.pid"; do
                  i=$((i+1))
                  if test "$i" -ge 15; then cat "$d/sshd.log" >&2; return 1; fi
                  sleep 1
              done
              kill -0 "$(cat "$d/sshd.pid")" || { cat "$d/sshd.log" >&2; return 1; }
              step=sshd-listen
              sockstat -4 -l | grep ':2222' || { cat "$d/sshd.log" >&2; return 1; }
          }
          stop_server() {
              pid=$(cat "$d/sshd.pid")
              kill "$pid"
              i=0
              while kill -0 "$pid" 2>/dev/null; do
                  i=$((i+1))
                  test "$i" -lt 20
                  sleep 1
              done
              rm -f "$d/sshd.pid"
          }
          start_server
          echo EXODUS_SSHD_STARTED
          step=auth
          test "$(client 'id -u')" = 60001
          rc=0
          client 'exit 23' || rc=$?
          test "$rc" = 23
          echo EXODUS_SSH_AUTH_PASS
          step=restart
          stop_server
          rc=0
          client 'exit 0' || rc=$?
          test "$rc" = 255
          start_server
          test "$(client 'printf "%s" EXODUS_RESTART_OK')" = EXODUS_RESTART_OK
          echo EXODUS_SERVICE_RESTART_PASS
          sync
          echo EXODUS_RESIDENT_SSH_READY
          EOF
          cat > probe.sh <<'EOF'
          #!/bin/sh
          set -eu
          d=/var/tmp/exodus-services
          result=$(ssh -n -F /dev/null -4 -T -p 2222 -i "$d/client" \
              -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=5 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known_hosts" \
              -o GlobalKnownHostsFile=/dev/null exodusprobe@127.0.0.1 'id -u')
          test "$result" = 60001
          EOF
          sh -n services.sh
          sh -n probe.sh
          mcopy -i seed.img services.sh probe.sh ::
          python3 - <<'PY'
          from pathlib import Path
          p=Path("authority/exodus/frankenstein/armv7_authority/awt_clone_relay.c")
          s=p.read_text()
          old='reply:\n        fputs'
          assert s.count(old)==1
          s=s.replace(old,'reply:\n        assert(system("/bin/sh /var/tmp/exodus-ssh-probe.sh")==0);\n        puts("EXODUS_SSH_DURING_A57_PASS");\n        fputs')
          p.write_text(s)
          PY
          mcopy -o -i seed.img authority/exodus/frankenstein/armv7_authority/awt_clone_relay.c ::
      - name: Adapt only boot profile of pinned dual-VM runner
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("authority/exodus/frankenstein/armv7_authority/awt_clone_run.py")
          s=p.read_text()
          start=s.index('cmd=["qemu-system-arm"')
          end=s.index('with open(log,',start)
          s=s[:start]+'''cmd=["qemu-system-arm","-M","vexpress-a9","-cpu","cortex-a9","-m","512",
               "-smp","1","-display","none","-serial","stdio","-monitor","none",
               "-no-reboot","-nic","none",
               "-device","loader,file=evidence/kernel.bin,addr=0x61000000,force-raw=on",
               "-device","loader,file=evidence/board.dtb,addr=0x60040000,force-raw=on",
               "-device","loader,file=handoff.bin,addr=0x60010000,cpu-num=0,force-raw=on",
               "-drive",f"if=none,file={disk},format=raw,id=system,snapshot=on",
               "-device","virtio-blk-device,drive=system",
               "-drive",f"if=none,file={seed},format=raw,id=seed,readonly=on",
               "-device","virtio-blk-device,drive=seed"]
          '''+s[end:]
          start=s.index('        child.expect(r"login:"')
          end=s.index('        child.sendline("test $(id -u)',start)
          s=s[:start]+r'''        deadline=time.monotonic()+180
                  while True:
                      event=child.expect([r"mountroot> *",r"Enter full pathname of shell or RETURN for /bin/sh: *",r"(?i)panic:"],timeout=max(1,deadline-time.monotonic()))
                      if event==0:
                          child.sendline("ufs:/dev/ufs/rootfs")
                      elif event==1:
                          child.sendline("")
                          break
                      else:
                          raise RuntimeError("A9 kernel panic")
                  child.expect(r"(?m)^(root@[^\r\n]* )?# *$",timeout=90)
                  child.sendline("uname -v | grep EXODUS_A9_REF && sysctl -n hw.model | grep -i cortex-a9 && mount -uw / && printf 'EXODUS_A9_%s\\n' ID_PASS")
                  child.expect(r"(?m)^EXODUS_A9_ID_PASS\r*\n",timeout=90)
                  child.expect(r"(?m)^(root@[^\r\n]* )?# *$",timeout=30)
                  child.sendline("service growfs onestart && df -h / && printf 'EXODUS_A9_%s\\n' ROOT_READY")
                  child.expect(r"(?m)^EXODUS_A9_ROOT_READY\r*\n",timeout=180)
                  child.expect(r"(?m)^(root@[^\r\n]* )?# *$",timeout=30)
          '''+s[end:]
          old='        child.sendline("shutdown -p now")\n        child.expect(pexpect.EOF,timeout=180)'
          assert s.count(old)==1
          s=s.replace(old,'        child.sendline("sync")\n        child.expect(r"# ",timeout=30)')
          # Stop the disposable emulator through the host, not guest poweroff.
          # pexpect's short signal grace period can fail while QEMU flushes.
          old='        child.close(force=True)'
          assert s.count(old)==1
          s=s.replace(old,'''        import os, signal
                  if child.isalive():
                      child.kill(signal.SIGTERM)
                      stop=time.monotonic()+10
                      while child.isalive() and time.monotonic()<stop:
                          time.sleep(0.1)
                      if child.isalive():
                          child.kill(signal.SIGKILL)
                          stop=time.monotonic()+10
                          while child.isalive() and time.monotonic()<stop:
                              time.sleep(0.1)
                  if child.isalive():
                      raise RuntimeError("A9 emulator did not terminate")
                  child.close(force=False)''')
          # Set up the service before entering the AWT relay, on the same VM.
          old='        child.sendline("mount -t msdosfs -o ro /dev/msdosfs/EXODUSSEED /mnt/exodus-seed && cp /mnt/exodus-seed/awt_clone_guest.sh'
          assert s.count(old)==1
          insert=r'''        child.sendline("mount -t msdosfs -o ro /dev/msdosfs/EXODUSSEED /mnt/exodus-seed && cp /mnt/exodus-seed/probe.sh /var/tmp/exodus-ssh-probe.sh && sh /mnt/exodus-seed/services.sh && umount /mnt/exodus-seed && printf 'EXODUS_RESIDENT_%s\\n' SETUP_PASS")
                  result=child.expect([r"(?m)^EXODUS_RESIDENT_SETUP_PASS\r*\n",r"(?m)^EXODUS_RESIDENT_RESULT=[1-9][0-9]* stage=[a-z-]+\r*\n"],timeout=180)
                  if result!=0: raise RuntimeError(child.match.group(0))
                  child.expect(r"(?m)^(root@[^\r\n]* )?# *$",timeout=30)
          '''
          s=s.replace(old,insert+old)
          old='        deadline=time.monotonic()+30'
          assert s.count(old)==1
          s=s.replace(old,'        deadline=time.monotonic()+180')
          old='                child.expect(r"(?m)^EXODUS_LIVE_REPLY'
          assert s.count(old)==1
          s=s.replace(old,r'''                child.expect(r"(?m)^EXODUS_SSH_DURING_A57_PASS\r*\n",timeout=30)
          '''+old)
          old='            marker=b"EXODUS_LIVE_CLONE_PASS\\n"'
          assert s.count(old)==1
          s=s.replace(old,r'''            q=read_exact(vm.stdout,64,deadline)
                      expected=b"AGX1"+bytes([1,1,0,0,2,3,5,4,0x12,0x34,0x56])+bytes(49)
                      assert q==expected
                      path=pathlib.Path(log).parent/"a57-frame.rgba"
                      p=subprocess.run(["./display-reference",str(path)],input=q,capture_output=True,check=True,timeout=5)
                      expected_pixels=bytes(v for y in range(12) for x in range(16)
                                            for v in ((0x12,0x34,0x56,255) if 2<=x<7 and 3<=y<7 else (0x14,0x20,0x30,255)))
                      assert path.read_bytes()==expected_pixels
                      assert len(p.stdout)==64 and p.stdout[32:35]==bytes([1,1,2])
                      write_all(vm.stdin,p.stdout)
                      print("PASS: A57 EL0 display request rendered through existing compositor",flush=True)
          '''+old)
          for kind in ("11 [Hypervisor Call]", "2 [SVC]"):
              old=f'assert lines.count("Taking exception {kind} on CPU 0")==5'
              assert s.count(old)==1
              s=s.replace(old,old[:-1]+"6")
          p.write_text(s)
          compile(s,str(p),"exec")
          PY
      - name: Execute source-built A9 and A57 process lifecycle
        run: |
          set -euo pipefail
          /usr/bin/python3 authority/exodus/frankenstein/armv7_authority/awt_clone_run.py disk.raw seed.img unused evidence/serial.log amp.elf evidence/a57-trace.log
          tr -d '\r' < evidence/serial.log > evidence/normalized.log
          for marker in EXODUS_A9_ID_PASS EXODUS_STORAGE_PASS EXODUS_LOOPBACK_PASS EXODUS_SSH_AUTH_PASS EXODUS_SERVICE_RESTART_PASS EXODUS_RESIDENT_SSH_READY EXODUS_RESIDENT_SETUP_PASS; do
            test "$(grep -Fxc "$marker" evidence/normalized.log)" = 1
          done
          test "$(grep -Fxc EXODUS_SSH_DURING_A57_PASS evidence/normalized.log)" = 4
          test "$(wc -c < evidence/a57-frame.rgba)" = 768
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exodus-combined-functional-evidence
          path: |
            evidence/*.log
            evidence/a57-frame.rgba
          if-no-files-found: warn
